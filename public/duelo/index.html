d or barely passed validation"],["d","Field accuracy is not a real metric"]],"k":["c"],"e":"Measuring only where the system already succeeded inflates the estimate; calibration requires a labeled sample representative of the full input stream. Hardest-only (A) biases in the opposite direction, the standard claim (B) is invented, and (D) is false.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-0b95c338","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"Your codebase-exploration agent has get_file_contents, read_source, and fetch_file tools that all read files, and it frequently picks poorly among them. What is the correct fix?","x":"Scenario: Developer productivity agent","o":[["a","Add a fourth, better file-reading tool"],["b","Fine-tune the model on the tool list"],["c","Randomize which tool the harness dispatches"],["d","Consolidate to one file-reading tool, or give the survivors sharply differentiated descriptions that state exactly when each applies"]],"k":["d"],"e":"Tool selection runs on descriptions; overlapping tools with vague descriptions produce dithering. Consolidation or sharp differentiation is the documented cure. Adding overlap (A) worsens it, fine-tuning (B) is disproportionate, and randomization (C) institutionalizes the confusion.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-ddcbe846","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"A support workflow resolves tickets by looking up an account, checking entitlement, and drafting a reply, always in that order. Which architecture is correct?","o":[["a","A deterministic pipeline that calls the model at each defined step"],["b","A single agent that decides each step at runtime"],["c","Three agents that negotiate the order between them"],["d","One prompt containing all three steps"]],"k":["a"],"e":"A known, fixed sequence should be encoded rather than rediscovered on every run, which makes it cheaper, faster, and testable step by step. Runtime decisions (B, C) add nondeterminism for no gain, and one prompt (D) removes the checkpoints between steps.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-92865354","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"What is the strongest justification for splitting work across subagents?","o":[["a","The task has many steps"],["b","Separate lines of work each need their own context, and mixing them degrades both"],["c","Subagents are faster than a single agent"],["d","The output must be assembled from several sections"]],"k":["b"],"e":"Subagents exist to isolate context, so the case for them is contamination between concerns rather than volume. Step count (A) and sectioned output (D) suit a workflow, and delegation usually adds latency rather than removing it (C).","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-97cdc807","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"An agent loops between two tools without converging. What is the most appropriate first control?","o":[["a","Increase the context window so it can see more history"],["b","Switch to a larger model"],["c","Impose a step ceiling and define the terminating condition explicitly"],["d","Remove one of the two tools"]],"k":["c"],"e":"Non-termination is bounded by an explicit stop condition and a hard ceiling, which contains cost and makes the failure visible. More context (A) and a larger model (B) do not guarantee convergence, and removing a tool (D) may break the task.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-71d3fd98","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"Which property most increases the operational risk of an agentic design?","o":[["a","It calls more than one model"],["b","It produces structured output"],["c","It runs longer than a minute"],["d","It takes irreversible actions without a checkpoint"]],"k":["d"],"e":"Reversibility governs the cost of being wrong, which is the dominant risk in autonomous execution. Multiple models (A), structure (B), and duration (C) affect cost and complexity rather than blast radius.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-e6a2fed8","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"How should an agentic system handle a step whose result it cannot verify?","o":[["a","Surface the unverifiable step for human confirmation before acting on it"],["b","Proceed, since the model is usually right"],["c","Retry the step until two runs agree"],["d","Log the step and continue"]],"k":["a"],"e":"An unverifiable result is exactly where human judgment belongs, before it is acted upon. Assuming correctness (B) and logging without stopping (D) both act on unchecked output, and agreement across runs (C) establishes consistency rather than truth.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-bc407542","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"A team proposes an agent for a task where every input is well formed and every rule is known. What should the architect recommend?","o":[["a","An agent, for future flexibility"],["b","A deterministic implementation, reserving model calls for the genuinely ambiguous parts"],["c","An agent with a low step limit"],["d","A multi-agent design for separation of concerns"]],"k":["b"],"e":"Known rules over well-formed input are code, and using a model there buys nondeterminism at a price. Speculative flexibility (A), a constrained agent (C), and multiple agents (D) all keep the cost without the need.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6c78a35a","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"What most improves the debuggability of an agentic system in production?","o":[["a","Reducing the number of tools"],["b","Using a single model for every step"],["c","Recording the inputs, tool calls, and outputs of each step as a trace"],["d","Increasing the step limit"]],"k":["c"],"e":"A per-step trace is what makes a nondeterministic run reconstructable after the fact. Fewer tools (A) and one model (B) simplify without explaining, and a higher ceiling (D) makes failures longer rather than clearer.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-0535597a","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"Where should conventions that apply to everyone working in a repository be recorded?","o":[["a","In each developer's personal settings"],["b","In the pull request template"],["c","In a pinned chat message"],["d","In a CLAUDE.md committed to the repository"]],"k":["d"],"e":"Committed project memory is versioned, reviewable, and shared, which is what a team convention requires. Personal settings (A) do not propagate, and templates (B) and messages (C) are not read as working context.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6740da90","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"What distinguishes work suited to headless mode?","o":[["a","It is well defined and repeatable, so it can run unattended in automation"],["b","It is complex and needs close supervision"],["c","It requires many tools"],["d","It produces a long output"]],"k":["a"],"e":"Headless execution suits bounded, repeatable work where no one is watching. Supervision (B) argues for interactive use, and tool count (C) and output length (D) do not determine suitability.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-59fd567c","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"A skill and a subagent could both address a need. What decides between them?","o":[["a","Skills are always preferable"],["b","Whether the need is reusable know-how or an isolated line of work with its own context"],["c","Whether the task is long"],["d","Whether the repository already has a CLAUDE.md"]],"k":["b"],"e":"The two solve different problems: a skill packages reusable procedure, a subagent isolates context. A blanket preference (A), duration (C), and existing files (D) do not address that distinction.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6e73a9a2","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"What is the correct use of a hook in a Claude Code workflow?","o":[["a","To hold instructions the model should follow"],["b","To store project context"],["c","To enforce a deterministic action at a defined point, independently of the model"],["d","To define which model is used"]],"k":["c"],"e":"Hooks run as code at fixed points, so they enforce rather than request. Instructions (A) and context (B) belong in project memory, and model choice (D) is configuration.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-dc4375e1","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"Claude Code performs well for one engineer and inconsistently across the team. What is the most likely cause?","o":[["a","The others need more capable machines"],["b","The repository is too large"],["c","The others are using different terminals"],["d","The working conventions live in one person's local setup rather than in the repository"]],"k":["d"],"e":"Context that is not committed does not travel, which produces exactly this asymmetry. Hardware (A), repository size (B), and terminal choice (C) do not explain a difference in output quality.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-0f441bc6","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A pipeline requires output that always validates against a schema. What is the correct approach?","o":[["a","Declare the schema as a tool the model must call, and validate on receipt"],["b","Ask for the schema in the prompt and validate afterwards"],["c","Ask for JSON and repair malformed output in code"],["d","Use a lower temperature"]],"k":["a"],"e":"A declared schema makes the structure part of the contract rather than a request, and validation on receipt closes the loop. Prompt requests (B), downstream repair (C), and temperature (D) all leave the shape to chance.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-35f62450","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"Extraction is accurate for common cases and fails on rare formats. What is the most effective response?","o":[["a","Raise the temperature to encourage flexibility"],["b","Add examples covering the rare formats and define what to return when a field is absent"],["c","Switch to a larger model"],["d","Ask the model to try harder on unusual inputs"]],"k":["b"],"e":"Rare cases fail because they are unspecified, and examples plus an explicit absent-field rule specify them. Temperature (A) adds variance, a larger model (C) is not aimed at the gap, and exhortation (D) is not a specification.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-138e9c0a","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"What should a schema define for a field the source document may not contain?","o":[["a","Nothing, since the model will omit it"],["b","A default value that looks plausible"],["c","An explicit representation for absence, so a missing value is distinguishable from an unfilled one"],["d","A free-text field for notes"]],"k":["c"],"e":"Absence must be representable, or downstream code cannot tell a genuine gap from a failure. Silent omission (A) is ambiguous, plausible defaults (B) fabricate data, and a notes field (D) does not make the state machine-readable.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-5002c6bb","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"Which practice most improves consistency across a long-running structured extraction job?","o":[["a","Randomising the order of documents"],["b","Increasing the output token limit"],["c","Running each document twice"],["d","Fixing the prompt, the schema, and the model version, and recording them with the output"]],"k":["d"],"e":"Consistency requires that the things that shape output are pinned and recorded, so results remain comparable and reproducible. Ordering (A) is irrelevant, the token cap (B) affects length, and duplicate runs (C) measure variance without removing it.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-0995acb0","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A prompt mixes the instruction, the data, and the output format in continuous prose. What is the first improvement?","o":[["a","Separate the sections so the instruction, the input, and the required format are distinguishable"],["b","Shorten it"],["c","Move it into the system prompt"],["d","Add emphasis to the format requirement"]],"k":["a"],"e":"Structure lets the model tell instruction from data, which is the most common source of confusion in long prompts. Shortening (B) may remove needed detail, relocation (C) does not clarify, and emphasis (D) does not separate.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-63cd3a97","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"What is the strongest indicator that a tool surface needs redesign?","o":[["a","It contains more than ten tools"],["b","The model regularly selects a tool that cannot accomplish the request"],["c","The tools return JSON"],["d","The tools are implemented across several services"]],"k":["b"],"e":"Repeated wrong selection is evidence that the tools are not distinguishable from their descriptions, which is a design fault. Tool count (A), return format (C), and implementation topology (D) are not themselves problems.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-d62c8e13","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"How should a tool that performs an irreversible action be designed?","o":[["a","With a description warning the model to be careful"],["b","So that it requires more parameters"],["c","So that authorisation and confirmation are enforced outside the model"],["d","So that it is declared last"]],"k":["c"],"e":"Irreversibility is controlled by the surrounding system, because a prompt-level warning is a request rather than a guarantee. Extra parameters (B) and ordering (D) do not constrain authority.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-a51780b2","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"A tool returns a large payload that consumes most of the context window. What is the right change?","o":[["a","Increase the context window"],["b","Summarise the payload with a second model call"],["c","Call the tool less often"],["d","Return only what the task needs, with a way to request more detail"]],"k":["d"],"e":"Tools should return task-relevant results rather than everything available, which keeps context for reasoning. A larger window (A) postpones the problem, a second call (B) adds cost and a failure point, and calling less often (C) does not change the payload.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-a07da616","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"What belongs in a tool's description?","o":[["a","What the tool does, when to use it, and what its parameters mean"],["b","The implementation language and framework"],["c","The service level agreement"],["d","The name of the team that owns it"]],"k":["a"],"e":"The description is the model's selection guide, so it must answer purpose, applicability, and parameters. Implementation detail (B), service levels (C), and ownership (D) are irrelevant to the choice.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-00fceb44","c":"CCAR-F","d":"Context Management & Reliability","s":"A long agentic run degrades in quality as it proceeds. What is the most likely cause?","o":[["a","The model version changed mid-run"],["b","Context has accumulated until relevant material competes with stale material"],["c","The temperature was set too low"],["d","The tools became slower"]],"k":["b"],"e":"Progressive degradation over a long run is the signature of context accumulation and drift. Versions do not change mid-run (A), low temperature (C) reduces variety rather than quality, and tool latency (D) does not affect correctness.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-147d736d","c":"CCAR-F","d":"Context Management & Reliability","s":"What is the right way to carry state across a compaction boundary?","o":[["a","Rely on the model to remember what mattered"],["b","Increase the context window so compaction is never needed"],["c","Write the decisions and constraints that must persist into an explicit summary that is carried forward"],["d","Restart the task after compaction"]],"k":["c"],"e":"Persistence must be deliberate, because compaction is lossy by design. Relying on recall (A) is unreliable, a larger window (B) only delays the boundary, and restarting (D) discards the work.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-11c6b138","c":"CCAR-F","d":"Context Management & Reliability","s":"Which measure most improves reliability for a workflow that must not silently produce wrong output?","o":[["a","A larger model"],["b","A longer prompt"],["c","More examples in the prompt"],["d","A validation step that can reject output and trigger a defined fallback"]],"k":["d"],"e":"Reliability against silent failure requires detection and a defined response, which is what validation with a fallback provides. Model size (A), prompt length (B), and examples (C) improve the average case without catching the bad one.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-e27b0031","c":"CCAR-F","d":"Context Management & Reliability","s":"What should be measured to know whether a production agentic system is healthy?","o":[["a","Task success against a defined criterion, plus the rate and shape of failures"],["b","Total tokens consumed"],["c","Average response time"],["d","The number of tool calls per run"]],"k":["a"],"e":"Health is defined by whether the system accomplishes the task and how it fails when it does not. Tokens (B), latency (C), and call counts (D) are cost and behavior signals that say nothing about correctness.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-bd69fb4c","c":"CCAR-F","d":"Context Management & Reliability","s":"The agent occasionally answers billing questions using an order it looked up three turns earlier for a different customer. What is the architectural fix?","o":[["a","Increase the context window"],["b","Scope each conversation's context to one customer and clear or isolate prior lookups when the subject changes"],["c","Remove the lookup_order tool"],["d","Instruct the model to be careful about customer identity"]],"k":["b"],"e":"Cross-customer contamination is a context-scoping defect, not a window-size problem","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-8030a4a7","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"process_refund fails intermittently because the billing backend times out. What should the tool return so the agent can behave sensibly?","o":[["a","An empty string"],["b","A message asking the user to try later"],["c","A structured error with a category and a retryable flag, so the agent can retry or escalate deliberately"],["d","The exception stack trace"]],"k":["c"],"e":"Structured errors with categories and retryable flags are what let an agent recover deliberately","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-874d6a7b","c":"CCAR-F","d":"Context Management & Reliability","s":"Which condition should route a ticket to escalate_to_human rather than continue autonomous resolution?","o":[["a","The customer writes in a language the agent supports"],["b","The order is more than thirty days old"],["c","The conversation exceeds five turns"],["d","The request falls outside documented policy, or the agent cannot make progress after a bounded number of attempts"]],"k":["d"],"e":"Policy gaps and lack of progress are the documented escalation triggers; turn counts and order age are not","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-62e3a793","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"The agent sometimes calls get_customer when it should call lookup_order. What is the most effective change?","o":[["a","Rewrite both tool descriptions so each states precisely when it applies and how it differs from the other"],["b","Reorder the tools in the configuration"],["c","Merge them into one tool with a mode flag"],["d","Increase the model's temperature"]],"k":["a"],"e":"Tool selection runs on descriptions, so differentiation is the fix for confusion between similar tools","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-37310ef0","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"Backend conventions should apply only when backend files are touched. Where do they belong?","o":[["a","In the root CLAUDE.md so they are always available"],["b","In a path-scoped rule under .claude/rules/ with frontmatter matching backend paths"],["c","In each engineer's user-level configuration"],["d","In the repository wiki"]],"k":["b"],"e":"Path-scoped rules load conditionally, which is exactly the stated requirement","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-7d14478d","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"When is plan mode the appropriate choice over direct execution?","o":[["a","For every change, since planning is always safer"],["b","Only when the model is unfamiliar with the language"],["c","When the change is large or risky enough that a human should review the approach before edits are made"],["d","When the context window is nearly full"]],"k":["c"],"e":"Plan mode is a human review gate for approach, warranted by risk rather than universally","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-66a81ed8","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"A repeated multi-step review procedure should be available to the whole team as a single invocation. What is the right mechanism?","o":[["a","A shared document describing the steps"],["b","A longer CLAUDE.md"],["c","A saved chat transcript"],["d","A custom slash command or skill committed to the repository"]],"k":["d"],"e":"Repeatable team procedures belong in committed commands or skills, not prose","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-1e6092bd","c":"CCAR-F","d":"Context Management & Reliability","s":"Subagents return full source documents to the coordinator, which then exceeds its context limit. What is the correct design change?","o":[["a","Have subagents return structured findings with citations while raw sources stay at the edge or in a scratchpad"],["b","Give the coordinator a larger model"],["c","Reduce the number of subagents to one"],["d","Truncate each document to its first page"]],"k":["a"],"e":"Delegation exists to keep bulk at the edge and move distilled results","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-699babe3","c":"CCAR-F","d":"Context Management & Reliability","s":"Final reports attribute claims to the wrong sources even though each subagent is individually accurate. What is the likely cause?","o":[["a","The synthesis model is too small"],["b","The handoff format does not carry claim and source together, so provenance is lost between stages"],["c","The search subagent returns too many results"],["d","Reports are generated before analysis completes"]],"k":["b"],"e":"Provenance survives handoffs only when the format carries claim and source together","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-d04a4e94","c":"CCAR-F","d":"Context Management & Reliability","s":"A subagent fails permanently on one source. What should the coordinator receive?","o":[["a","Nothing, so the report proceeds"],["b","A silent retry loop until it succeeds"],["c","A propagated error with enough context to decide between retry, exclusion with a noted gap, or abort"],["d","A generic failure flag with no detail"]],"k":["c"],"e":"Errors must propagate with enough context for the coordinator to choose a recovery path","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-819e48f8","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"The reviewer must emit results a pipeline can parse. Which invocation is correct?","o":[["a","Interactive session with output redirected to a log"],["b","Plan mode with an approval step"],["c","A cron job that emails the transcript"],["d","Non-interactive print mode with JSON output and a schema"]],"k":["d"],"e":"CI requires non-interactive invocation with structured, schema-validated output","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-61d5146d","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"Reviews flag many low-value style nits and engineers now ignore them. Which change addresses this?","o":[["a","Define explicit review criteria and a severity bar in the prompt, with examples of in-scope and out-of-scope findings"],["b","Post findings to a separate channel"],["c","Run the review only on large pull requests"],["d","Cap output at five findings"]],"k":["a"],"e":"Precision comes from explicit criteria and examples that draw the signal boundary","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-bfee1fbe","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"Some invoices legitimately lack a delivery date. How should the schema express this?","o":[["a","Make the field required and let extraction fail"],["b","Make the field nullable so absence is recorded explicitly, with conditional validation where the document type requires it"],["c","Omit the field from the schema"],["d","Default it to today's date"]],"k":["b"],"e":"Nullable fields record legitimate absence; required fields force fabrication or failure","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-ff84aa14","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"Which loop gives the most reliable extraction output?","o":[["a","Generate, then manually review every record"],["b","Generate three times and take the majority"],["c","Enforce a JSON schema through tool use, validate, and on failure retry with the validation error provided to the model"],["d","Generate with temperature zero and accept the result"]],"k":["c"],"e":"Schema enforcement plus a validation-retry loop is the reliability pattern the guide describes","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-fbad8fff","c":"CCAR-F","d":"Context Management & Reliability","s":"Your team reports 97% accuracy measured only on records that passed validation. Why is that number misleading?","o":[["a","Accuracy should be measured per field, not per record"],["b","97% is too low to report"],["c","Validation and accuracy are unrelated"],["d","It excludes the failures, so it measures where the system already succeeded rather than the true rate across all documents"]],"k":["d"],"e":"Measuring only validated records is a biased sample; calibration needs coverage of all documents","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-42b35ac2","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"A pipeline has four steps whose order never varies and whose outputs are each checkable. What should it be?","o":[["a","An agent that plans each run"],["b","Four agents, one per step"],["c","A deterministic workflow with model calls at defined points"],["d","A single prompt covering all four steps"]],"k":["c"],"e":"A known fixed order is encoded rather than rediscovered, which is cheaper and testable per step. Runtime planning (A, B) adds nondeterminism, and one prompt (D) removes the checkpoints","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-85be56a2","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"What is the principal cost of introducing a subagent?","o":[["a","It loses the context the parent held unless the handoff carries it explicitly"],["b","It requires a larger model"],["c","It cannot use tools"],["d","It doubles token cost in every case"]],"k":["a"],"e":"Delegation buys isolation and pays in context, which is why handoffs must be explicit. A subagent does not require a larger model (B), can use tools (C), and cost varies with the work (D)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-468302fc","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"An autonomous step would modify production data. What does the architecture require?","o":[["a","A more capable model"],["b","A longer system prompt describing caution"],["c","A retry policy"],["d","A checkpoint where a person authorises the action, or a reversible mechanism"]],"k":["d"],"e":"Irreversible external effects need an authorisation boundary or reversibility, enforced outside the model. Capability (A), instruction (B), and retries (C) do not bound the consequence","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-54beb38f","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"What most helps diagnose an agentic failure after the fact?","o":[["a","The final output alone"],["b","A trace of each step's inputs, tool calls, and outputs"],["c","The total token count"],["d","The model version"]],"k":["b"],"e":"A per-step trace reconstructs a nondeterministic run, which is what diagnosis needs. The final output (A), token totals (C), and version (D) do not show where it diverged","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-8b3b62be","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"Where should repository-wide conventions for Claude Code live?","o":[["a","In each developer's local configuration"],["b","In a CLAUDE.md committed to the repository"],["c","In the team's chat channel"],["d","In the CI configuration only"]],"k":["b"],"e":"Committed project memory is shared, versioned, and reviewed with the code. Local configuration (A) does not propagate, chat (C) is not read as context, and CI (D) covers automation rather than interactive work","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-5c5fea1d","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"Which task is best suited to headless Claude Code in CI?","o":[["a","Exploratory debugging of an unfamiliar failure"],["b","Designing a new module's architecture"],["c","Pair programming with a developer"],["d","A repeatable, well-specified check that runs on every pull request"]],"k":["d"],"e":"Headless execution suits bounded, repeatable work that runs unattended. Exploration (A), design (B), and pairing (C) all depend on a person in the loop","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-5776c2a6","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"What is a hook for?","o":[["a","Running a deterministic action at a defined point, independently of the model"],["b","Storing reusable instructions"],["c","Holding project context"],["d","Selecting the model"]],"k":["a"],"e":"Hooks execute as code at fixed points, which is how a guarantee is enforced. Instructions (B) and context (C) belong in project memory, and model choice (D) is configuration","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-665223c8","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A pipeline needs output that always conforms to a fixed shape. What is the correct mechanism?","o":[["a","Requesting the shape in the prompt and parsing the result"],["b","Post-processing prose with regular expressions"],["c","Declaring the shape as a schema the model must satisfy, and validating on receipt"],["d","Lowering the temperature"]],"k":["c"],"e":"A declared schema makes the shape a contract rather than a request, and validation closes the loop. Prompt requests (A), text parsing (B), and temperature (D) leave the shape to chance","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6f46e296","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"How should a schema handle a value the source may not contain?","o":[["a","Omit the field silently"],["b","Supply a plausible default"],["c","Return an empty string in all cases"],["d","Define an explicit representation for absence"]],"k":["d"],"e":"Absence must be representable so a genuine gap is distinguishable from a failure. Silent omission (A) is ambiguous, a plausible default (B) fabricates, and an empty string (C) conflates absence with an empty value","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-58d8ba48","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"Extraction succeeds on typical inputs and fails on unusual ones. What is the most effective response?","o":[["a","Raise the temperature"],["b","Use a larger model"],["c","Add examples covering the unusual formats and state what to return when a field is missing"],["d","Ask the model to be careful with unusual inputs"]],"k":["c"],"e":"The unusual cases fail because they were never specified, and examples plus a missing-value rule specify them. Temperature (A) adds variance, model size (B) is not aimed at the gap, and exhortation (D) is not specification","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-45c3c1e6","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"What is the clearest sign that a tool surface needs redesign rather than better prompting?","o":[["a","It exposes more than five tools"],["b","The model repeatedly selects a tool that cannot satisfy the request"],["c","The tools are implemented in different services"],["d","The tools return large payloads"]],"k":["b"],"e":"Repeated wrong selection indicates the tools are not distinguishable from their descriptions, which is a design fault. Tool count (A) and implementation topology (C) are not faults, and payload size (D) is a separate problem","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-3b61b34b","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"How should a tool that deletes records be constrained?","o":[["a","By enforcing authorisation and scope outside the model"],["b","By a description warning the model to use it carefully"],["c","By requiring more parameters"],["d","By declaring it last among the tools"]],"k":["a"],"e":"Destructive capability is bounded by the surrounding system, since a description is a request rather than a control. Extra parameters (C) and ordering (D) do not limit authority","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-b88967c7","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"An MCP integration exposes an entire database through one general query tool. What is the architectural concern?","o":[["a","The model's authority is unbounded, and least privilege cannot be applied"],["b","It will be slow"],["c","It uses too many tokens"],["d","It cannot return structured output"]],"k":["a"],"e":"A single unrestricted tool removes the ability to scope what the model may reach. Speed (B) and tokens (C) are secondary, and structured output (D) is achievable either way","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-c742c5c1","c":"CCAR-F","d":"Context Management & Reliability","s":"Quality degrades steadily through a long agentic run. What is the most likely cause?","o":[["a","The model version changed mid-run"],["b","Accumulated context has diluted the material that matters"],["c","The temperature is too low"],["d","The tools have become slower"]],"k":["b"],"e":"Progressive degradation over a long run is the signature of context accumulation. Versions do not change mid-run (A), low temperature (C) reduces variety rather than quality, and tool latency (D) does not affect correctness","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-b9fa29bb","c":"CCAR-F","d":"Context Management & Reliability","s":"What must happen for state to survive a compaction boundary?","o":[["a","Nothing, the model retains what matters"],["b","The context window must be enlarged"],["c","The decisions and constraints that must persist are written into an explicit carried-forward summary"],["d","The run must restart"]],"k":["c"],"e":"Compaction is lossy, so persistence must be deliberate. Relying on recall (A) is unreliable, a larger window (B) only moves the boundary, and restarting (D) discards the work","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-4235b7ea","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"An agentic design calls the same expensive tool repeatedly with identical arguments. What does this indicate?","o":[["a","Healthy retry behavior"],["b","The tool is too fast"],["c","The agent is not retaining or reusing the result, which points at the state design"],["d","The model is too capable"]],"k":["c"],"e":"Repeating an identical call means the prior result is not available to the agent, which is a state problem. It is not retry behavior (A), and neither tool speed (B) nor capability (D) explains it","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-1924a53c","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"What determines whether two lines of work belong in separate subagents?","o":[["a","Whether each needs context the other would pollute"],["b","Their combined length"],["c","Whether they use different tools"],["d","Whether they can run in parallel"]],"k":["a"],"e":"Context isolation is the reason subagents exist. Length (B), tool difference (C), and parallelism (D) can all be handled within one context","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-66fa3831","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"Which design most reduces the cost of a wrong autonomous decision?","o":[["a","A larger model"],["b","A longer prompt"],["c","More tools"],["d","Making the action reversible, or gating it behind confirmation"]],"k":["d"],"e":"Reversibility and gating bound the consequence, which is what the risk is. Capability (A), prompt length (B), and tools (C) affect the chance of error rather than its cost","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-ed375b12","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"A CLAUDE.md has grown to several thousand lines. What is the likely effect?","o":[["a","Better results, because more context is available"],["b","The instructions that matter compete with material that no longer applies"],["c","No effect, since it is read once"],["d","Faster responses"]],"k":["b"],"e":"Project memory is context and dilutes like any other. More is not automatically better (A), it is not free (C), and it does not speed anything up (D)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-449d9847","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"What should be true of a skill before it is committed to a shared repository?","o":[["a","It is long enough to be useful"],["b","It encodes a procedure the team genuinely repeats, and it is reviewable"],["c","It is written by the most senior engineer"],["d","It covers every edge case"]],"k":["b"],"e":"A shared skill is justified by genuine repetition and must be reviewable like code. Length (A), authorship (C), and exhaustiveness (D) do not establish that","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-eea92ed9","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"Why is committed configuration preferable to per-developer configuration for team conventions?","o":[["a","It is faster to load"],["b","It uses less context"],["c","It cannot be overridden"],["d","It is versioned, reviewed, and applies to everyone including automation"]],"k":["d"],"e":"Shared, reviewed, versioned context is what makes a convention hold across people and CI. Speed (A) and context size (B) are not the reason, and it can still be overridden locally (C)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-4633b07c","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A schema-validated response fails validation once in every few hundred calls. What is the correct handling?","o":[["a","Define a fallback path: retry, then fail explicitly rather than passing invalid data on"],["b","Ignore it, since the rate is low"],["c","Disable validation to avoid the failures"],["d","Increase the output token limit"]],"k":["a"],"e":"A rare failure still needs a defined path, and silently passing invalid data is the outcome to prevent. Ignoring it (B) and disabling validation (C) do exactly that, and the token limit (D) is not the cause","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-b224dc24","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"What is the advantage of validating structured output at the boundary rather than downstream?","o":[["a","It is cheaper"],["b","It removes the need for a schema"],["c","The failure is caught where it can still be retried or rejected, before it contaminates later steps"],["d","It improves model accuracy"]],"k":["c"],"e":"Catching at the boundary contains the fault. It is not primarily a cost question (A), the schema is what makes it possible (B), and it does not change the model's accuracy (D)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-dea2883c","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A structured extraction must record where in the source each value came from. What does this require?","o":[["a","A larger model"],["b","A longer prompt"],["c","A second extraction pass"],["d","The schema to include a provenance field the model must populate"]],"k":["d"],"e":"Anything the output must carry has to be part of the declared shape. Model size (A) and prompt length (B) do not create a field, and a second pass (C) is unnecessary if the schema asks for it","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-53289f68","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"Two tools do nearly the same thing with different names. What is the architectural fault?","o":[["a","Duplication of code"],["b","Higher latency"],["c","The model has no reliable basis for choosing between them"],["d","Increased token cost"]],"k":["c"],"e":"Ambiguity at the point of selection is the fault, because the model chooses from descriptions. Code duplication (A), latency (B), and cost (D) are secondary consequences","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-90c67cae","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"What should a tool do when given arguments it cannot satisfy?","o":[["a","Return the closest result it can"],["b","Return a clear error stating what was wrong, so the model can correct the call"],["c","Return an empty result"],["d","Raise an exception that terminates the run"]],"k":["b"],"e":"An informative error keeps the model able to adapt. A closest-guess (A) and an empty result (C) are silently wrong, and terminating (D) discards a recoverable run","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-ee671537","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"An MCP tool exposes a write operation that the use case never needs. What should happen?","o":[["a","Remove it, because unused authority is unnecessary risk"],["b","Leave it, since it may be useful later"],["c","Document that it should not be used"],["d","Rename it to discourage use"]],"k":["a"],"e":"Authority that is not needed should not be granted. Retaining it for possible future use (B), documenting (C), or renaming (D) all leave the capability reachable","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-16561a8a","c":"CCAR-F","d":"Context Management & Reliability","s":"What is the earliest reliable signal that context management has failed in a long run?","o":[["a","The agent begins repeating work or contradicting earlier decisions"],["b","The run takes longer than expected"],["c","Token cost rises"],["d","A tool returns an error"]],"k":["a"],"e":"Repetition and self-contradiction are the behavioral signature of lost state. Duration (B) and cost (C) rise for many reasons, and a tool error (D) is unrelated","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-98940f36","c":"CCAR-F","d":"Context Management & Reliability","s":"Why is a defined success criterion necessary for a reliable agentic system?","o":[["a","It reduces token cost"],["b","Without it there is no way to tell completion from failure, so the system cannot stop correctly or be measured"],["c","It makes the prompt shorter"],["d","It is required by the platform"]],"k":["b"],"e":"Termination and measurement both depend on a definition of done. Cost (A), prompt length (C), and platform requirements (D) are not the reason","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6329307c","c":"CCAR-F","d":"Context Management & Reliability","s":"A reliability requirement says wrong output must never reach the user unnoticed. What does the design need?","o":[["a","A more capable model"],["b","More examples in the prompt"],["c","A detection step with a defined action when it fires"],["d","A longer context window"]],"k":["c"],"e":"Preventing silent error requires detection plus a response. Capability (A), examples (B), and context (D) improve the average case without catching the bad one","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-5fa46d74","c":"CCAR-P","d":"Integration","s":"An internal agent for account managers can read CRM records, draft emails, update opportunities, and delete contacts. Account managers only ever read records and draft emails through it. Under least privilege, what is the right change?","o":[["a","Log every update and deletion for later audit"],["b","Add a confirmation dialog before updates and deletions"],["c","Restrict deletions to business hours"],["d","Remove the update and delete capabilities from the agent's configuration entirely"]],"k":["d"],"e":"Least privilege removes capabilities the role does not need, eliminating the attack and error surface rather than monitoring it. Logging (A) and confirmations (B) are compensating controls around a privilege that should not exist, and scheduling (C) narrows the window without closing it.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-ef43e784","c":"CCAR-P","d":"Integration","s":"After a nightly document refresh, your RAG assistant's answers turned confident but wrong. Model version, prompts, and latency are unchanged. Where do you look first?","o":[["a","The retrieval and indexing layer: whether the refresh broke the index, changed chunking, or introduced mismatched embeddings"],["b","The model, which may have degraded overnight"],["c","The system prompt wording"],["d","The temperature setting"]],"k":["a"],"e":"The only thing that changed is the document pipeline, and confident-but-wrong is the signature of plausible-but-irrelevant retrieved context. The pinned model (B), unchanged prompt (C), and sampling (D) do not correlate with the refresh.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-d6f7b547","c":"CCAR-P","d":"Integration","s":"Your platform will expose forty internal capabilities to agents across many teams. Loading all forty tool definitions into every agent's context is bloating prompts and degrading tool selection. What is the architectural remedy?","o":[["a","Shorter tool descriptions across the board"],["b","Progressive discovery: agents load a small task-relevant toolset, with search or namespacing to pull in others when needed"],["c","One mega-tool with a mode parameter selecting among forty behaviors"],["d","Limit the platform to ten capabilities"]],"k":["b"],"e":"At large tool counts, progressive discovery beats monolithic context: each agent sees what its task needs. Uniformly terser descriptions (A) trade selection quality for tokens, a mode-switch mega-tool (C) hides forty behaviors from the selection mechanism entirely, and capping the platform (D) sacrifices the requirement.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-c6099b3d","c":"CCAR-P","d":"Solution Design and Architecture","s":"A bank wants a system that answers loan officers' policy questions with citations, and separately drafts decline letters from structured decision data. A vendor proposes one autonomous multi-agent system for both. What is the sounder architecture?","o":[["a","The proposed multi-agent system, since both tasks involve documents"],["b","One agent with all tools and a routing prompt"],["c","Two simple components: a retrieval-augmented answer service for policy questions, and a templated generation workflow for letters, each evaluated on its own metrics"],["d","A single fine-tuned model for both"]],"k":["c"],"e":"Two well-understood problems with different shapes deserve the two cheapest reliable structures, independently testable and governable. Shared document-ness (A) is not an architectural argument, one agent with everything (B) couples unrelated risk profiles, and fine-tuning (D) is the most expensive path to problems retrieval and templates already solve.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-4f20cc0f","c":"CCAR-P","d":"Solution Design and Architecture","s":"Your architecture review board asks why you chose a deterministic workflow over an autonomous agent for claims intake. Which justification reflects the tested decision framework?","o":[["a","Agents are a newer pattern and less proven in general"],["b","Workflows always outperform agents"],["c","The team lacked time to build an agent"],["d","The intake path is fully known in advance, so deterministic orchestration is cheaper, auditable, and reliable; autonomy earns its complexity only where the model must choose the path"]],"k":["d"],"e":"The framework is structural fit: known path, deterministic orchestration; open-ended path, agent. Novelty (A) and universal claims (B) are not engineering arguments, and resourcing (C) justifies a schedule, not an architecture.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-ec7913a8","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"Legal review quality is subjective, and your team disagrees about whether the assistant's clause summaries are \"good.\" What makes evaluation tractable?","o":[["a","Define a rubric with the failure modes that matter, build a labeled evaluation set with counsel, and combine rubric-based model grading with periodic human review"],["b","Ship and count complaints"],["c","Exact string match against one reference summary per clause"],["d","Grade outputs by length"]],"k":["a"],"e":"Subjective quality becomes measurable through rubrics, labeled sets, and mixed methodology with humans anchoring the judgment. Complaint-counting (B) measures too late, exact match (C) fails every valid paraphrase, and length (D) measures nothing.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-94c614f0","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"A prompt change looks better in demos. Before rolling it to all users, what is the disciplined path?","o":[["a","Roll it out; demos are representative"],["b","Run it against the regression evaluation set, then A/B it against the current prompt on real traffic with predefined metrics before full rollout"],["c","Ask the team to vote"],["d","Roll out to everyone with a feedback banner"]],"k":["b"],"e":"Changes to prompts are production changes: regression evaluation catches breakage, and an A/B on defined metrics establishes improvement before exposure. Demos (A) and votes (C) are anecdotes, and full rollout with a banner (D) is the experiment without the control.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-795883fc","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"A healthcare client requires that no protected health information reach the model provider, while clinicians want free-text queries about patients. Which design meets both?","o":[["a","Trust clinicians to avoid typing identifiers"],["b","A system prompt instructing the model to forget PHI"],["c","A de-identification layer that strips or tokenizes PHI before the API call, re-associating results locally, with logging and periodic audits of the boundary"],["d","Blocking free-text queries entirely"]],"k":["c"],"e":"Compliance boundaries are enforced by architecture: PHI is removed before it crosses, and the control is auditable. Trust (A) is not a control, model instructions (B) act after the data already crossed, and a hard block (D) fails the stated business need that a compliant design can meet.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-65690d27","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"Your Claude solution's executive sponsor asks for \"99.9% accuracy or we cancel.\" Accuracy on the task plateaus near 92% with human review catching the rest. What is the architect's correct move?","o":[["a","Promise 99.9% and hope model upgrades close the gap"],["b","Decline to discuss numbers with non-engineers"],["c","Quietly redefine accuracy so the number reads higher"],["d","Reframe the target around the end-to-end process: the system plus confidence-routed human review achieves the business outcome, with measured rates, costs, and the tradeoff curve made explicit"]],"k":["d"],"e":"Managing expectations with explicit, honest tradeoffs is scored material at this level: the deliverable is the business outcome of the whole pipeline, not a raw model metric. Overpromising (A), stonewalling (B), and metric games (C) each destroy the trust the role exists to build.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-b5041397","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"Three teams configure Claude Code independently: conventions drift, and new engineers take days to become productive. What is the enablement fix?","o":[["a","Ship a shared baseline: version-controlled team configuration, common skills and commands, and an onboarding path, with team-specific rules layered on top"],["b","Mandate that engineers memorize the conventions"],["c","Prohibit Claude Code until conventions settle"],["d","Let each engineer keep personal settings only"]],"k":["a"],"e":"Team-level enablement means shared, versioned configuration with local extension, which is what makes tooling productive at organizational scale. Memorization (B) does not configure anything, prohibition (C) discards the productivity the domain exists to deliver, and personal-only settings (D) is the drift you started with.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-a4d92827","c":"CCAR-P","d":"Integration","s":"A customer requires that no request data leave their AWS account. Which deployment satisfies the constraint?","o":[["a","The Claude API with a signed data processing agreement"],["b","Claude through Amazon Bedrock within the customer's own account and region"],["c","The Claude API with request logging disabled"],["d","Any deployment, provided the data is encrypted in transit"]],"k":["b"],"e":"A residency constraint of this kind is met by running within the customer's own cloud boundary, which is what Bedrock provides. A contractual agreement (A), disabled logging (C), and transport encryption (D) all still involve the data leaving the account.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-852ad77c","c":"CCAR-P","d":"Integration","s":"An enterprise standardised on Google Cloud and requires identity, billing, and audit to run through existing controls. What follows?","o":[["a","Deploy on Bedrock for feature parity"],["b","Use the Claude API and replicate the controls"],["c","Deploy through Vertex AI so the platform's identity, billing, and audit apply"],["d","Let each team choose its own path"]],"k":["c"],"e":"Aligning with the platform the enterprise already governs is what makes existing controls apply without duplication. A different cloud (A) creates a second control plane, replication (B) is expensive and drifts, and per-team choice (D) removes governance.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-f8107c2c","c":"CCAR-P","d":"Integration","s":"A design places Claude behind an internal service that every application calls. What is the principal benefit?","o":[["a","It reduces token cost"],["b","It removes the need for evaluation"],["c","It guarantees lower latency"],["d","Authentication, rate limiting, logging, and model routing are enforced in one place"]],"k":["d"],"e":"A single integration point is where cross-cutting concerns can be applied consistently and changed once. It does not reduce token cost (A) or remove the need to evaluate (B), and an extra hop generally adds latency (C).","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-1c008757","c":"CCAR-P","d":"Integration","s":"A legacy system can only call synchronous endpoints with a two-second timeout, but the task needs long reasoning. What is the appropriate design?","o":[["a","Accept the request, return an identifier immediately, and deliver the result asynchronously"],["b","Force the model to answer within two seconds"],["c","Increase the legacy timeout"],["d","Use the smallest model available"]],"k":["a"],"e":"Decoupling submission from delivery lets the constraint and the workload coexist without degrading either. Truncating the reasoning (B, D) sacrifices the task, and changing the legacy system (C) is usually the constraint rather than an option.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-161a5ec4","c":"CCAR-P","d":"Integration","s":"What is the most important consideration when a solution must run across two clouds?","o":[["a","Using identical prompts in both"],["b","Establishing which behaviors must be identical and evaluating for those on each platform"],["c","Choosing the cheaper platform for both"],["d","Deploying to whichever region is nearest"]],"k":["b"],"e":"Cross-platform equivalence is a requirement to be defined and then verified, not assumed. Identical prompts (A) do not guarantee identical behavior, and cost (C) and proximity (D) do not address consistency.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-2fbe9069","c":"CCAR-P","d":"Solution Design and Architecture","s":"A stakeholder asks for an autonomous agent to handle an end-to-end financial approval process. What should the architect establish first?","o":[["a","Which model to use"],["b","The expected token cost"],["c","Which decisions carry accountability and must remain with a person"],["d","Whether the agent can be built in the available time"]],"k":["c"],"e":"Where accountability sits determines the shape of the solution and what may be automated at all. Model choice (A), cost (B), and schedule (D) are all downstream of that boundary.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-1b0e2adf","c":"CCAR-P","d":"Solution Design and Architecture","s":"Two designs meet the functional requirement. One is simpler and slightly less capable. What should decide?","o":[["a","The more capable design, since capability is the point"],["b","The design the team finds more interesting"],["c","The design with more components, for future flexibility"],["d","Whether the extra capability is needed by a stated requirement, weighed against the cost of complexity"]],"k":["d"],"e":"Complexity is a cost paid continuously in operation and maintenance, so it must be bought by a real requirement. Capability for its own sake (A), preference (B), and speculative flexibility (C) all pay that cost without justification.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-f689d5fd","c":"CCAR-P","d":"Solution Design and Architecture","s":"A proposed architecture depends on the model behaving correctly for a control that regulation requires. What is the correct judgment?","o":[["a","Unacceptable: a required control must be enforced deterministically outside the model"],["b","Acceptable if evaluation shows high accuracy"],["c","Acceptable with a disclaimer to the regulator"],["d","Acceptable if a larger model is used"]],"k":["a"],"e":"A regulatory control needs a guarantee, and probabilistic behavior cannot supply one however high the measured accuracy. Accuracy (B), disclosure (C), and model size (D) do not convert a tendency into a guarantee.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-c8236cc9","c":"CCAR-P","d":"Solution Design and Architecture","s":"What is the clearest sign that a solution has been over-engineered?","o":[["a","It uses more than one model"],["b","Components exist that no stated requirement depends on"],["c","It has an evaluation suite"],["d","It includes a human approval step"]],"k":["b"],"e":"Unjustified components are the definition of over-engineering and are the parts that will rot. Multiple models (A), evaluation (C), and approval steps (D) are all defensible when a requirement calls for them.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-5079c75d","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"What must exist before a solution can be said to be ready for production?","o":[["a","A demonstration that impressed stakeholders"],["b","Agreement from the engineering team"],["c","A defined success criterion and measured performance against representative data"],["d","A completed cost estimate"]],"k":["c"],"e":"Readiness is a measured claim against a stated bar, which is what distinguishes it from an impression. Demonstrations (A), consensus (B), and cost (D) do not establish whether the system works.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-79792a46","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"An evaluation set is drawn entirely from cases the system already handles well. What is the consequence?","o":[["a","It gives a reliable measure of quality"],["b","It is acceptable if it is large enough"],["c","It only matters for regulated systems"],["d","It overstates performance and hides the failure modes that matter"]],"k":["d"],"e":"An unrepresentative set measures the wrong distribution, and size cannot correct a biased sample. It is not reliable (A), scale does not fix bias (B), and the problem is universal rather than sector-specific (C).","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6d34975c","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"A prompt change improves the target metric but degrades an unmeasured behavior. How is this best prevented?","o":[["a","Maintaining a regression suite that covers behaviors the system must not lose"],["b","Changing one thing at a time"],["c","Reviewing changes more carefully"],["d","Limiting how often prompts change"]],"k":["a"],"e":"Silent regressions are caught by explicitly testing what must not break. Single changes (B) and careful review (C) reduce risk without detecting it, and slowing change (D) does not make it safe.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-8debd022","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"What should trigger re-evaluation of a deployed solution?","o":[["a","Only a reported incident"],["b","A change to the model, the prompt, the data distribution, or the requirement"],["c","A fixed annual schedule"],["d","A change in cost"]],"k":["b"],"e":"Any change to the things that determine behavior invalidates prior measurement. Waiting for incidents (A) detects late, a fixed schedule (C) is unrelated to actual change, and cost (D) does not affect correctness.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-f78681a0","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"How should an architect treat a request to log full prompts and responses for audit?","o":[["a","Implement it, since audit requirements take precedence"],["b","Refuse, since logging creates risk"],["c","Establish what the audit actually requires, since prompts and responses may contain personal or confidential data"],["d","Log responses only"]],"k":["c"],"e":"Audit and data protection are both real constraints, and the design must satisfy the audit purpose without retaining more than is warranted. Blanket implementation (A) and blanket refusal (B) ignore one side, and a partial rule (D) is arbitrary without knowing the requirement.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-a36bcf9b","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"What is the correct treatment of content retrieved from an untrusted source before it reaches the model?","o":[["a","It is safe once scanned for known attack strings"],["b","It is safe if the model is instructed to disregard instructions within it"],["c","It is safe if it comes over an encrypted channel"],["d","It is untrusted data throughout, and the model's authority must be bounded regardless of its content"]],"k":["d"],"e":"The durable control is that the model cannot exceed its permissions whatever the content persuades it to attempt. String scanning (A) and prompt instructions (B) are bypassable, and transport security (C) says nothing about the content.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6a706524","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"Who is accountable for a wrong decision produced by an automated Claude workflow?","o":[["a","The organization that deployed the workflow"],["b","The model provider"],["c","The engineer who wrote the prompt"],["d","Nobody, since the output was automated"]],"k":["a"],"e":"Deploying an automated decision means owning its outcomes, which is why the boundaries of automation are an architectural decision. The provider (B) supplies a capability, individual authorship (C) does not transfer organizational responsibility, and automation does not remove accountability (D).","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-baf24fb7","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"An executive sponsor asks for a single number showing how good the solution is. What is the right response?","o":[["a","Provide the headline accuracy figure"],["b","Provide the measure that matches the decision they face, with its limits stated"],["c","Explain that quality cannot be summarised"],["d","Provide the model's benchmark score"]],"k":["b"],"e":"A useful metric is one tied to the decision at hand and honest about what it does not cover. A bare accuracy figure (A) and a benchmark score (D) can mislead, and refusing to summarise (C) fails the sponsor.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-58c031a5","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"A pilot succeeded with ten users and the business wants to roll out to two thousand. What should the architect raise first?","o":[["a","The cost of additional licenses"],["b","The need for a larger model"],["c","Which assumptions held at ten users and may not hold at two thousand"],["d","The training schedule"]],"k":["c"],"e":"Scale invalidates assumptions about inputs, support, and edge cases, and naming those is the architect's contribution. Licenses (A), model size (B), and training (D) are downstream of knowing what breaks.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-d7090e44","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"What most reduces the risk that a delivered solution decays after handover?","o":[["a","Full documentation at delivery"],["b","A longer warranty period"],["c","Training every user"],["d","A named owner with a defined routine for evaluation, monitoring, and update"]],"k":["d"],"e":"Decay is prevented by ongoing ownership and a routine, not by artefacts produced once. Documentation (A) and training (C) age, and a warranty (B) covers defects rather than drift.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-5962f651","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"How should an architect choose a model for a solution with several different tasks?","o":[["a","Match each task to the smallest model that meets its requirement, and evaluate the choices"],["b","One model for everything, for simplicity"],["c","The largest model for everything, for safety"],["d","The newest model for everything"]],"k":["a"],"e":"Different tasks have different requirements, and matching each keeps cost proportionate while evidence supports the choice. Uniform choices (B, C, D) optimise for convenience rather than fit.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-3481b7c2","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"What is the correct treatment of the context window in a production design?","o":[["a","A capacity to fill as fully as possible"],["b","A budget to allocate deliberately between instructions, retrieved material, and working state"],["c","A limit that only matters for long documents"],["d","A setting to raise when quality drops"]],"k":["b"],"e":"Context is a scarce resource whose allocation determines quality, so it is designed rather than consumed. Filling it (A) invites dilution, it matters well beyond long documents (C), and enlarging it (D) does not fix an allocation problem.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-1c2f28d3","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"A solution's prompts are maintained by three teams and have diverged. What is the appropriate remedy?","o":[["a","Appoint one team to own all prompting"],["b","Freeze the prompts"],["c","Version the prompts as artefacts with defined ownership, review, and evaluation on change"],["d","Move all prompts into the system prompt"]],"k":["c"],"e":"Prompts that determine production behavior deserve the same lifecycle as code. Centralising ownership (A) may not fit the organization, freezing (B) blocks improvement, and relocation (D) does not address governance.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-20979fc3","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"An organization wants consistent Claude Code practice across many repositories. What is the most durable approach?","o":[["a","A written policy circulated by email"],["b","A one-off training session"],["c","Requiring approval for each use"],["d","Committed project memory and shared skills in each repository, reviewed like code"]],"k":["d"],"e":"Conventions travel when they live in the repository and are reviewed with the work. Policies (A) and training (B) fade, and per-use approval (C) creates friction without conveying practice.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-933874f8","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"What is the most useful measure of whether a developer enablement program is working?","o":[["a","Change in the outcomes the tooling was adopted to improve"],["b","The number of people trained"],["c","License utilization"],["d","The volume of tool calls"]],"k":["a"],"e":"Enablement is justified by the outcome it moves, which is what should be measured. Attendance (B), utilization (C), and activity (D) measure uptake rather than benefit.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-cdd8ab8e","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"A team reports that Claude Code helps with new code but hurts on a legacy service. What should the architect investigate?","o":[["a","Whether the team needs more training"],["b","Whether the legacy service lacks the committed context and conventions the model needs"],["c","Whether a larger model would help"],["d","Whether the legacy service should be rewritten"]],"k":["b"],"e":"A difference between codebases usually reflects a difference in the context available in each. Training (A) does not supply repository context, a larger model (C) cannot infer undocumented conventions, and a rewrite (D) is a disproportionate response to a diagnosis not yet made.","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-dee8f66e","c":"CCAR-P","d":"Solution Design and Architecture","s":"A retailer wants Claude to answer product questions from a 40,000-document catalog that changes daily. Which architecture fits?","o":[["a","Fine-tune a model on the catalog nightly"],["b","Load the catalog into the system prompt"],["c","Retrieval over an index refreshed as the catalog changes, with the model answering from retrieved context"],["d","An autonomous agent that browses the public website"]],"k":["c"],"e":"Frequently changing knowledge belongs in retrieval, not in weights or a context window","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-48498b14","c":"CCAR-P","d":"Integration","s":"After a re-index, your retrieval system returns semantically similar but commercially wrong products. Which investigation comes first?","o":[["a","The generation prompt"],["b","The model version"],["c","The user interface"],["d","Chunking and embedding configuration, and whether the index was rebuilt consistently"]],"k":["d"],"e":"Degradation following a re-index points at chunking, embeddings, and index consistency","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-273a164b","c":"CCAR-P","d":"Integration","s":"An agent used by 300 employees exposes 45 tools across eight systems. Selection quality is degrading. What is the architectural response?","o":[["a","Scope toolsets per task or role, with progressive discovery for the rest"],["b","Shorten all tool descriptions"],["c","Merge tools into a few multi-mode tools"],["d","Replace the agent with a larger model"]],"k":["a"],"e":"At large tool counts, scoping and progressive discovery preserve selection quality","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-a2677ab2","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"Which evaluation design best fits a summarization feature where quality is subjective?","o":[["a","Exact match against reference summaries"],["b","A rubric covering the failure modes that matter, applied by model graders and periodically audited by humans on a labeled set"],["c","Average output length compared to references"],["d","User thumbs-up counts alone"]],"k":["b"],"e":"Subjective quality becomes measurable through rubrics, labeled sets, and mixed methodology","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-3d201d05","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"Before a prompt change reaches all users, what is the disciplined sequence?","o":[["a","Ship it and monitor complaints"],["b","Team vote followed by rollout"],["c","Regression evaluation, then a controlled A/B against the current prompt on predefined metrics, then rollout"],["d","Rollout with a feedback form"]],"k":["c"],"e":"Prompt changes are production changes: regression first, then a controlled comparison","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-e67cdb36","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"A hospital system requires that protected health information never reach the model provider, while clinicians need free-text search. Which design satisfies both?","o":[["a","A policy instructing clinicians not to type identifiers"],["b","A system prompt instructing the model to disregard PHI"],["c","Restricting the feature to structured queries only"],["d","A de-identification layer that removes or tokenizes PHI before the call, with local re-association and auditing"]],"k":["d"],"e":"Compliance boundaries are enforced architecturally before data crosses, and audited","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-78d74552","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"Which is the correct application of human-in-the-loop review at scale?","o":[["a","Route by confidence and consequence, so low-confidence and high-impact cases reach humans while routine cases flow through"],["b","Review every output regardless of risk"],["c","Review a fixed 10% sample chosen at random"],["d","Review only what users complain about"]],"k":["a"],"e":"Confidence and consequence routing makes human review affordable and effective","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-c174fd7c","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"An executive sponsor demands a single accuracy number for a system whose performance varies sharply by document type. What does a competent architect present?","o":[["a","The highest observed number"],["b","Performance broken out by document type with the aggregate, the measurement method, and what the business outcome is after human review"],["c","A refusal to quantify"],["d","An average weighted to look favorable"]],"k":["b"],"e":"Honest segmentation plus method and end-to-end outcome is what earns and keeps trust","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-5c3a0561","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"Your design must satisfy GDPR for EU customer data. Which requirement most directly shapes the architecture?","o":[["a","Response latency targets"],["b","The choice of programming language"],["c","Data minimization, purpose limitation, and the ability to delete personal data on request"],["d","The number of model providers"]],"k":["c"],"e":"GDPR drives minimization, purpose limitation, and erasure, all of which shape design","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-d070741e","c":"CCAR-P","d":"Solution Design and Architecture","s":"Which is the correct reason to prefer a workflow over an agent for a document intake process?","o":[["a","Workflows are always more accurate"],["b","Agents cannot process documents"],["c","Workflows use less context"],["d","The processing path is known in advance, so deterministic orchestration is cheaper, testable, and auditable"]],"k":["d"],"e":"Known path, deterministic orchestration; autonomy earns its complexity only when the path is not known","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-d1c071b5","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"An application sends an identical 12,000-token policy preamble on every request. Which optimization addresses both latency and cost?","o":[["a","Ordering the static preamble first and enabling prompt caching"],["b","Splitting the preamble across two requests"],["c","Summarizing the preamble with the model at request time"],["d","Moving the preamble into a few-shot block"]],"k":["a"],"e":"A stable cached prefix cuts time-to-first-token and per-request cost together","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-59d65f74","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"What belongs in an architecture decision record for a Claude system?","o":[["a","The final design only"],["b","The decision, the alternatives considered, the tradeoffs, and the constraints that drove the choice"],["c","The team members involved"],["d","The implementation timeline"]],"k":["b"],"e":"A decision record captures alternatives and tradeoffs, not just the outcome","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-d6d40eee","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"Observability for a production agent should capture which of the following to make incidents diagnosable?","o":[["a","Final outputs only"],["b","Aggregate latency metrics only"],["c","Traces of tool calls, retrieved context, and decision points alongside outputs"],["d","User feedback only"]],"k":["c"],"e":"Without traces of tool calls and retrieved context, failures cannot be localized to a layer","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6619034d","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"A partner team wants to adopt your Claude Code setup. What makes adoption durable rather than a one-time handoff?","o":[["a","A recorded walkthrough"],["b","A shared chat channel"],["c","Individual coaching sessions"],["d","Version-controlled shared configuration, common skills and commands,
