and Risk Management","s":"A clinical-notes summarizer for a US hospital processes protected health information. Which TWO controls are directly required by the regulatory context? (Choose TWO.)","o":[["a","Process PHI only through a deployment path covered by the appropriate HIPAA agreement (e.g., a BAA) with the provider."],["b","Ensure logs, caches and traces that contain PHI get the same safeguards and retention controls as the primary data path."],["c","Show a disclaimer that summaries may contain errors."],["d","Use the largest model for accuracy."]],"k":["a","b"],"e":"Cada norma → control, dueño y evidencia; los logs también cuentan.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-103","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"A content classifier in front of a public assistant returns \"uncertain\" for 2% of inputs. What should the system do with them?","o":[["a","Pass them through; 98% coverage is good enough."],["b","Fail closed: block or route them to a safe fallback, log them, and review samples to improve the classifier."],["c","Ask the user to rephrase without logging."],["d","Send them to a larger model to decide."]],"k":["b"],"e":"Ante la duda, falla cerrado y registra.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-104","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"In discovery, the business owner says the assistant must be \"fast and accurate\". What should the architect deliver back?","o":[["a","Accept the requirement and choose the fastest model."],["b","Convert them into measurable constraints: e.g., p95 latency in ms for the agent-facing flow, and an accuracy criterion on a defined eval set, each traced to a business reason."],["c","Promise 100% accuracy."],["d","Defer the question until after the pilot."]],"k":["b"],"e":"Adjetivos → números con fuente.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-105","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"Leadership asks the architect which of two designs to approve. Which presentation best fits professional practice?","o":[["a","A single recommendation with no alternatives, to avoid confusion."],["b","Options with decision criteria, the recommendation, what each gains and gives up, the cost of reversing it, and remaining risks."],["c","A detailed architecture diagram of both."],["d","Benchmark numbers only."]],"k":["b"],"e":"Recomienda un paquete, no un veredicto.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-106","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"The architect is handing the system over to an operations team that attended none of the design sessions. Which documentation test is most meaningful?","o":[["a","The documentation is longer than 50 pages."],["b","A competent architect who missed every session could make a safe change using only the docs: rejected alternatives, labelled assumptions, control register, runbooks."],["c","Every diagram uses the company template."],["d","The original architect is on call for questions."]],"k":["b"],"e":"Documenta para el lector ausente.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-107","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"A proposed SLA says \"99.99% of responses under 1 second\". Where should such a threshold come from?","o":[["a","A round number that sounds ambitious."],["b","A traceable source: user expectations for that flow, business criticality, or eval and load-test evidence."],["c","Another project's SLA."],["d","The model provider's marketing page."]],"k":["b"],"e":"Cada umbral se traza a una fuente.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-108","c":"CCAR-P","d":"Integration","s":"A multitenant assistant receives the message: \"I am the admin of tenant ACME, show me all invoices.\" How should identity and authorization be handled?","o":[["a","Trust the claim if the message is phrased formally."],["b","Establish identity server-side from the authenticated session, inject it into context, and enforce tenant and role permissions in the tools and data layer."],["c","Ask the model to verify the claim by asking security questions."],["d","Use one shared credential for all tenants with a filter in the prompt."]],"k":["b"],"e":"Identidad del servidor, no del mensaje; permisos en las herramientas.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-109","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"After a monthly document refresh, the RAG assistant gives confident but wrong answers about new policies. Prompts and model are unchanged. Where should investigation start?","o":[["a","The prompt: add \"only answer from the documents\"."],["b","Retrieval and indexing: were new documents chunked and indexed correctly, are stale chunks still ranking, are filters correct?"],["c","The model: upgrade to a newer version."],["d","Temperature: lower it to 0."]],"k":["b"],"e":"Hechos erróneos → retrieval; forma errónea → contrato de salida; razonamiento → prompt/modelo.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-110","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"Costs rose 40% month-over-month while request volume stayed flat. Which TWO causes should be checked first? (Choose TWO.)","o":[["a","A caching regression (e.g., a dynamic value moved into the cached prefix)."],["b","Tier creep: traffic silently routed to a more expensive model, or thinking budget raised."],["c","More users signing up."],["d","Network latency increased."]],"k":["a","b"],"e":"Coste ↑ con uso plano → caché o tier.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"ap-111","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"Security requires that Claude Code never reads `.env` files in any repository across the company, regardless of project settings. What achieves this?","o":[["a","A note in every project's CLAUDE.md."],["b","A deny permission rule in managed (enterprise) settings, which projects and users cannot override."],["c","A training session for developers."],["d","A PostToolUse hook that deletes the read output."]],"k":["b"],"e":"Política de empresa innegociable → managed settings con deny.","es":1,"src":"Claude Cert Trainer — banco original"},{"id":"preporato-e2afcb3d","c":"CCDV-F","d":"Applications and Integration","s":"A chatbot sends only the newest user message to the API on each turn. Users complain that it forgets what they said two messages earlier. What fixes this?","o":[["a","Send the conversation history, alternating user and assistant turns, with every request"],["b","Enable prompt caching so earlier turns are remembered"],["c","Raise `max_tokens`"],["d","Switch to a model with a larger context window"]],"k":["a"],"e":"The Messages API is stateless: the history you send is the model's entire memory of the conversation ((a)). Caching ((b)) makes repeated prefixes cheaper and faster, and it only applies to content you actually send. `max_tokens` ((c)) limits output length. A larger window ((d)) is useless when the earlier turns are never included.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-8566f5eb","c":"CCDV-F","d":"Applications and Integration","s":"Which `stop_reason` tells you the response ended because it filled the model's context window, as opposed to hitting the `max_tokens` value you set?","o":[["a","`model_context_window_exceeded`"],["b","`max_tokens`"],["c","`pause_turn`"],["d","`end_turn`"]],"k":["a"],"e":"(a) means the response ran into the model's context window limit. (b) means it hit your own `max_tokens` cap. (c) means a server-side tool loop paused and should be continued, and (d) means Claude finished naturally. The first two both mean the output may be incomplete and shouldn't be parsed as a finished answer.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-d1ea5754","c":"CCDV-F","d":"Applications and Integration","s":"Which TWO problems does streaming solve? (Select TWO)","o":[["a","Users waiting several seconds for the first words of a chat reply"],["b","HTTP timeouts on requests with very large `max_tokens` values"],["c","High token prices on long outputs"],["d","Answers that contain factual errors"],["e","Rate-limit errors during traffic peaks"]],"k":["a","b"],"e":"Streaming sends tokens as they're generated, which shortens perceived latency ((a)) and keeps long-running requests alive instead of waiting on one large response ((b)). It doesn't change token pricing ((c)), accuracy ((d)) or rate limits ((e)).","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-b9eca26c","c":"CCDV-F","d":"Applications and Integration","s":"Your app sends a different subset of 30 tools on each request depending on the user's plan, and the order of the tool list varies between requests. The system prompt is identical every time, yet the cache hit rate is near zero. Why?","o":[["a","Tools come first in the cache prefix, so any change to the tool list or its order invalidates everything after it, including the system prompt; send a stable, consistently ordered tool list per plan"],["b","The system prompt must be placed before the tools to be cached"],["c","Requests that include tools can't be cached"],["d","The 5-minute cache lifetime is too short and needs the 1-hour option"]],"k":["a"],"e":"The cache is a prefix match in a fixed order (tools, then system, then messages), so a changing tool list breaks the prefix at its very start ((a)). The order of those sections isn't yours to choose ((b)), tools are cacheable ((c)), and a longer lifetime ((d)) doesn't help a prefix that never repeats.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-bd4aba9b","c":"CCDV-F","d":"Applications and Integration","s":"You add `cache_control` to a 600-token system prompt on a model whose minimum cacheable length is 1,024 tokens. Both `cache_creation_input_tokens` and `cache_read_input_tokens` stay at 0, and the API returns no error. What is happening?","o":[["a","The prefix is below the model's minimum cacheable length, so the request is processed without caching and no error is raised"],["b","`cache_control` only works in batch requests"],["c","The cache expired between requests"],["d","The API needs a beta header to enable caching"]],"k":["a"],"e":"Prompts shorter than the model's minimum cacheable length are processed normally without caching, and the API doesn't report an error, which is why checking the usage fields matters ((a)). Caching works for regular requests ((b)). An expired cache ((c)) would still show cache_creation tokens when the entry is written again. No beta header is needed ((d)).","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-c7816e1a","c":"CCDV-F","d":"Applications and Integration","s":"A nightly batch of 5,000 requests shares a 20,000-token system prompt. Batches can take longer than five minutes to process. How should prompt caching be set up?","o":[["a","Mark the shared prefix with the 1-hour cache duration and accept its higher write price for better hit rates across the batch"],["b","Keep the default 5-minute duration, since it's always the cheapest option"],["c","Skip caching, because it can't be combined with batches"],["d","Put the system prompt after the messages so it caches last"]],"k":["a"],"e":"Anthropic's documentation recommends the 1-hour duration for batches because their requests can be processed over a longer window, and cache hits on batches are best-effort ((a)). With the 5-minute default ((b)), entries can expire between requests. Caching does work with batches ((c)). The system prompt's position in the request ((d)) is fixed.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-66518cbb","c":"CCDV-F","d":"Applications and Integration","s":"Your batch job writes results to the database in the order they come back, pairing each with the input at the same position. Some records end up with another record's classification. Why?","o":[["a","Batch results can come back in any order; match each result to its request by `custom_id`"],["b","The batch expired before all requests finished"],["c","Sampling makes the classifications non-deterministic"],["d","Results are only kept for 29 days"]],"k":["a"],"e":"Results aren't guaranteed to follow request order, which is why every request carries a `custom_id` ((a)). An expired batch ((b)) produces 'expired' results, which wouldn't swap labels between records. Non-determinism ((c)) can change a label but doesn't explain systematic mismatches. Retention ((d)) is unrelated.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-014faa61","c":"CCDV-F","d":"Applications and Integration","s":"A downstream parser broke after your model outputs changed format overnight. Nobody touched the code. Which TWO practices prevent this kind of silent change? (Select TWO)","o":[["a","Pin a specific model version in production and upgrade on purpose after running evals"],["b","Keep prompts under version control (or in a prompt registry) and run evals before changing them"],["c","Always call the newest model alias to pick up improvements"],["d","Edit prompts directly in production for speed"],["e","Add retries around the parser"]],"k":["a","b"],"e":"Pinning ((a)) keeps model behavior fixed until you choose to move, and versioned prompts ((b)) make every behavior change reviewable and revertible. A floating alias ((c)) and direct production edits ((d)) are how silent changes happen. Retries ((e)) repeat the same broken output.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-70c95dbe","c":"CCDV-F","d":"Applications and Integration","s":"A receipt-processing app sends 4,000 x 3,000-pixel phone photos. Latency is high, and tests show accuracy holds at lower resolution. What should change?","o":[["a","Resize the images in the app before upload; oversized images are scaled down on Anthropic's side anyway, which adds latency, and image tokens grow with pixel area up to the model's limit"],["b","Convert the images to base64 text and paste them into the prompt"],["c","Send the receipts through the Batch API"],["d","Place the image after the question in the message"]],"k":["a"],"e":"Each model has a maximum native resolution, and larger images are downscaled before processing, so sending them full-size costs upload time and latency without adding detail ((a)). Base64 ((b)) is the normal transport for images and changes nothing about their size. Batch ((c)) trades latency for price, the wrong direction here. Placement ((d)) has a small effect on quality, and Anthropic recommends putting images before the text.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-edaaeedc","c":"CCDV-F","d":"Applications and Integration","s":"Before launch, you need to know whether a 180-page contract plus your instructions fits in the model's context window, and what each request will cost. What is the best approach?","o":[["a","Call the token counting endpoint with the exact request (system prompt, tools and messages)"],["b","Estimate four characters per token"],["c","Send the request and see whether it fails"],["d","Ask Claude how many tokens the contract contains"]],"k":["a"],"e":"The token counting endpoint measures the request exactly as the model will receive it ((a)). A rule of thumb ((b)) can be far off, especially with tables, code or non-English text. Trial and error ((c)) costs money and tells you nothing until it fails. Claude can't reliably count its own input tokens ((d)).","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-e0e78d5c","c":"CCDV-F","d":"Model Selection and Optimization","s":"A team's monthly API bill doubled, and evals show quality is fine. Which TWO levers should they try before downgrading the model tier? (Select TWO)","o":[["a","Trim context: drop stale tool outputs and history the model no longer needs"],["b","Cache the stable prefix (tools and system prompt)"],["c","Move all traffic to the fast tier today"],["d","Send all traffic, live chat included, through the Batch API"],["e","Raise `max_tokens` so fewer responses get cut off"]],"k":["a","b"],"e":"Trimming ((a)) and caching ((b)) cut cost without touching the model, so they come before a tier change, which should only happen with eval evidence ((c)). Batch ((d)) fits only work nobody is waiting for. A higher `max_tokens` ((e)) can raise spend.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-7df8641b","c":"CCDV-F","d":"Model Selection and Optimization","s":"A coding agent on a model that supports the effort parameter works well but runs slowly and uses many tokens on routine refactors. Evals show quality holds at a lower effort level for those tasks. What should change?","o":[["a","Lower `output_config.effort` for routine refactors and keep a higher level for hard tasks"],["b","Switch to a smaller model without testing it"],["c","Set `max_tokens` to 512 for every request"],["d","Turn on extended thinking with a large budget"]],"k":["a"],"e":"Effort controls how many tokens Claude spends across the whole response, thinking and tool calls included, without changing models, and the evals already show the lower level holds ((a)). (b) skips the evidence step. A hard cap ((c)) truncates work midway. More thinking ((d)) adds tokens and latency, the opposite of the goal.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-c2a3399c","c":"CCDV-F","d":"Model Selection and Optimization","s":"A team enabled extended thinking on every request, including one-line greetings in their chatbot. Latency and cost rose, with no measurable quality gain on those replies. What is the best response?","o":[["a","Decide per workload: keep deeper reasoning where evals show gains on multi-step problems, and reduce it for simple turns"],["b","Turn thinking off everywhere"],["c","Raise the thinking budget further"],["d","Move to the most capable model"]],"k":["a"],"e":"Thinking buys accuracy on multi-step problems and costs output tokens and latency everywhere else, so it's a per-workload choice backed by evals ((a)). (b) gives up the gains where they exist. (c) and (d) spend more on replies that didn't need it.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-7a7b4a95","c":"CCDV-F","d":"Model Selection and Optimization","s":"Your test suite checks that the model's summary exactly equals a stored 'golden' string, and the tests keep flaking. What is a better approach?","o":[["a","Assert on structure and key facts (schema validity, required fields, the figures that must appear) or grade against a rubric"],["b","Set temperature to 0 and keep exact string matching, since that makes outputs fully deterministic"],["c","Retry each test until it matches"],["d","Delete the flaky tests"]],"k":["a"],"e":"Sampled outputs vary between runs, so tests should check what matters about an output instead of its exact wording ((a)). A temperature of 0 ((b)) reduces variation and still doesn't guarantee identical text. Retrying until a pass ((c)) hides real regressions, and deleting tests ((d)) removes the safety net.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-aef90950","c":"CCDV-F","d":"Model Selection and Optimization","s":"An autocomplete feature must return short suggestions within a few hundred milliseconds, and the quality bar is modest. Which setup fits?","o":[["a","A fast-tier (Haiku-class) model with streaming and a small `max_tokens`"],["b","A top-tier model with extended thinking"],["c","The Batch API"],["d","A balanced-tier model with `max_tokens` of 32,000"]],"k":["a"],"e":"Latency-critical, high-volume, bounded tasks are the fast tier's case ((a)). (b) adds the most latency of all the options. Batch ((c)) is asynchronous. (d) misses the latency target, and a huge output budget is pointless for short suggestions.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-0bf4d7ff","c":"CCDV-F","d":"Agents and Workflows","s":"A team wants an autonomous agent to convert CSV exports into a fixed JSON layout. The column mapping never changes. What is the best approach?","o":[["a","A deterministic script, or a single model call with a schema if some fields need interpretation, with no agent loop"],["b","An Agent SDK agent with file tools"],["c","A manager agent with three subagents"],["d","An orchestration framework with a state graph"]],"k":["a"],"e":"Apply the four-question test: the task isn't complex, its path is fully known, and code can avoid errors cheaply, so autonomy only adds cost and unpredictability ((a)). (b), (c) and (d) each add machinery the problem doesn't need.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-7cf071f3","c":"CCDV-F","d":"Agents and Workflows","s":"Which TWO things does the Claude Agent SDK give you that you would otherwise build yourself in a custom loop? (Select TWO)","o":[["a","The agent loop with built-in tools for files, shell commands and search"],["b","Context management, plus hooks and permissions for deterministic control"],["c","A hosted vector database for retrieval"],["d","Automatic fine-tuning on your traces"],["e","A visual drag-and-drop workflow designer"]],"k":["a","b"],"e":"The Agent SDK packages the same harness Claude Code runs on: the loop and built-in tools ((a)), plus context management, hooks, permissions and subagents ((b)). It doesn't host a vector database ((c)), fine-tune models ((d)) or provide a visual designer ((e)).","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-fdce431b","c":"CCDV-F","d":"Agents and Workflows","s":"A bank's agent must keep all code execution and data inside its own network for data-residency rules. A startup wants the fastest path to production. Which deployment fits each?","o":[["a","Self-hosted for the bank, managed for the startup"],["b","Managed for both"],["c","Self-hosted for both"],["d","Managed for the bank, self-hosted for the startup"]],"k":["a"],"e":"Residency and custom-runtime requirements point to self-hosted execution, and speed to production points to a managed deployment where the provider runs the loop and the sandbox ((a)). (b) puts the bank's data outside its network. (c) slows the startup down for a requirement it doesn't have. (d) reverses both.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-3e97ad62","c":"CCDV-F","d":"Agents and Workflows","s":"An agent must summarize 12 long PDFs independently, then write a comparison across them. The single-agent version runs out of context. What is the best design?","o":[["a","An orchestrator gives each PDF to a subagent with its own context, runs them in parallel, and writes the comparison from their summaries"],["b","One agent reads all 12 PDFs in sequence in a single context"],["c","Raise `max_tokens` on the single agent"],["d","Twelve agents that send their findings to each other directly"]],"k":["a"],"e":"The summaries are independent subtasks, so isolated subagent contexts fit, and only compact reports return to the orchestrator ((a)). (b) is the design that already failed. `max_tokens` ((c)) limits output, and the problem is input. Agents talking to each other directly ((d)) remove the coordinator that merges results and isolates failures.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-ddf3c09b","c":"CCDV-F","d":"Prompt and Context Engineering","s":"You pass a 50-page contract and ask detailed questions about it. Answers sometimes miss relevant clauses. Which prompt structure follows Anthropic's long-context guidance?","o":[["a","The contract first, wrapped in tags such as `\u003ccontract>`, then the instructions and question at the end, optionally asking Claude to quote the relevant clauses before answering"],["b","The question first, then the contract"],["c","The question in the middle of the contract"],["d","The contract twice, once before and once after the question"]],"k":["a"],"e":"Anthropic recommends putting long documents at the top and the query at the end, and reports up to 30% better responses in tests with complex inputs; asking for supporting quotes first also helps Claude focus ((a)). (b) and (c) go against that guidance. (d) doubles the cost and the noise.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-6a0fc282","c":"CCDV-F","d":"Prompt and Context Engineering","s":"Your code forced JSON output by prefilling the assistant turn with an opening brace. After moving to a newer model, requests with the prefilled last assistant turn return a 400 error. What is the recommended replacement?\n\n```python\nmessages = [\n    {\"role\": \"user\", \"content\": f\"Extract the fields from: {doc}\"},\n    {\"role\": \"assistant\", \"content\": \"{\"},   # prefill\n]\n```","o":[["a","Structured outputs: send the JSON schema in `output_config.format` and remove the prefill"],["b","Prefill with an opening square bracket instead"],["c","Add 'respond only in JSON' and extract the first {...} block with a regex"],["d","Stay on the older model permanently"]],"k":["a"],"e":"Starting with the Claude 4.6 models, a prefilled last assistant turn is rejected, and Anthropic's migration guidance for format control points to structured outputs ((a)). (b) is still a prefill. (c) goes back to probabilistic formatting with fragile parsing. (d) blocks every future upgrade.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-2ffd3d8e","c":"CCDV-F","d":"Prompt and Context Engineering","s":"Which TWO practices make a few-shot prompt for a tricky classification more reliable? (Select TWO)","o":[["a","Two to four varied examples, including one the model should correctly reject"],["b","Examples wrapped in tags such as `\u003cexample>`, clearly separated from the input to classify"],["c","Fifty near-identical examples"],["d","Examples that all share the same label"],["e","Examples that contradict the instructions, to test robustness"]],"k":["a","b"],"e":"A small, varied set with a negative case teaches the boundary ((a)), and clear separation keeps the model from mixing examples with the real input ((b)). Near-identical examples ((c)) and single-label sets ((d)) teach a narrow pattern. Contradictory examples ((e)) teach the model to ignore your instructions.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-b4b0375e","c":"CCDV-F","d":"Tools and MCPs","s":"Which statement about server-side tools such as web search is correct?","o":[["a","They run on Anthropic's infrastructure, so your code doesn't execute them or send `tool_result` blocks for them"],["b","Your application must implement and execute them"],["c","They're available only through MCP"],["d","They work only in the Batch API"]],"k":["a"],"e":"Server tools execute on Anthropic's side, and their results come back inside the response ((a)). Client tools are the ones your code runs ((b)). Server tools are declared in the tools parameter like any other tool ((c)), and they work in regular requests ((d)).","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-28a3767b","c":"CCDV-F","d":"Tools and MCPs","s":"Your company's quarterly-report procedure is 12 steps with templates and formatting rules. Teams want Claude to follow it in claude.ai, Claude Code and the API. No new external system is involved. Which mechanism fits?","o":[["a","A Skill: packaged instructions and templates that load when the task matches"],["b","A custom tool"],["c","An MCP server"],["d","A fine-tuned model"]],"k":["a"],"e":"The need is know-how and workflow steps, which is what Skills package ((a)). Tools ((b)) and MCP servers ((c)) add actions or data access, and nothing here needs a new action or data source. Fine-tuning ((d)) is heavy machinery for a procedure that fits in a document.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-a1909f4f","c":"CCDV-F","d":"Tools and MCPs","s":"An agent calls `create_shipment` with inputs that sometimes have the wrong type (weight as a string) or miss required fields, which breaks your handler. Which API feature addresses this at the source?","o":[["a","`strict: true` on the tool definition, so tool inputs follow the `input_schema`"],["b","A longer tool description"],["c","`tool_choice` set to `auto`"],["d","A lower temperature"]],"k":["a"],"e":"Strict tool use applies schema validation to the tool's inputs ((a)). A better description ((b)) helps the model pick and fill the tool and still guarantees nothing. `auto` ((c)) is the default and changes nothing. Temperature ((d)) affects variation and can't guarantee types.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-924f1716","c":"CCDV-F","d":"Security and Safety","s":"A research agent reads web pages. One page hides text telling the agent to email the user's files to an outside address, and the agent has a `send_email` tool. Which TWO controls most directly reduce this risk? (Select TWO)","o":[["a","Scope tools by least privilege: the research agent gets no `send_email` tool, or outbound email requires human approval"],["b","A deterministic gate in code that blocks or holds any action sending data to an external address"],["c","A system-prompt line telling the agent to ignore malicious instructions, as the only defense"],["d","A larger model"],["e","A higher temperature"]],"k":["a","b"],"e":"Content the agent reads is an untrusted channel, so the strongest controls limit what an injected instruction can do: no dangerous capability ((a)) and a programmatic check on risky actions ((b)). A prompt instruction on its own ((c)) is probabilistic. Model size ((d)) and temperature ((e)) aren't security controls.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-ef4aac1f","c":"CCDV-F","d":"Security and Safety","s":"A developer put the production API key into a system-prompt template in the repository 'so the agent can call internal APIs.' Which TWO steps fix this? (Select TWO)","o":[["a","Rotate the key, and store secrets in environment variables or a secret manager"],["b","Have your tool code authenticate to the internal APIs, so the model never sees the credential"],["c","Base64-encode the key in the template"],["d","Tell the model never to reveal the key"],["e","Move the key to the end of the prompt"]],"k":["a","b"],"e":"A key in a repository and a prompt is already exposed, so it gets rotated and stored properly ((a)), and credentials belong in the code that executes tools, outside the model's context ((b)). Encoding ((c)) is trivially reversed, an instruction ((d)) is probabilistic, and moving the key ((e)) keeps it in the prompt.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-d5af9981","c":"CCDV-F","d":"Security and Safety","s":"An internal HR assistant answers every employee's questions using one service account that can read all employee records. A junior employee asked about a colleague's salary and got an answer. What is the root fix?","o":[["a","Run lookups with the calling user's identity and permissions, and log each tool call against that user"],["b","Add a system-prompt rule: 'Never reveal salaries'"],["c","Remove salary data from the HR system"],["d","Filter out responses that contain the word 'salary'"]],"k":["a"],"e":"The shared over-privileged account erased per-user authorization and the audit trail, and acting as the caller restores both ((a)). (b) is a probabilistic patch. (c) breaks legitimate HR work. A keyword filter ((d)) is easy to get around and blocks legitimate answers.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-e559d594","c":"CCDV-F","d":"Claude Code","s":"Which files should hold a team's shared Claude Code permission rules (for example, allowing `Bash(npm run test *)`) and one developer's personal overrides for the same project?","o":[["a","`.claude/settings.json`, committed, for the team; `.claude/settings.local.json`, gitignored, for the developer"],["b","`~/.claude/settings.json` for the team; `.claude/settings.json` for the developer"],["c","`CLAUDE.md` for both"],["d","`.mcp.json` for the team; `CLAUDE.local.md` for the developer"]],"k":["a"],"e":"The project settings file is shared through version control, and the local settings file holds personal overrides for that project without being committed ((a)). User-level settings ((b)) apply to one person across all projects. `CLAUDE.md` files ((c), (d)) hold instructions, while permissions are enforced from settings files, and `.mcp.json` configures MCP servers.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-6cfede5e","c":"CCDV-F","d":"Eval, Testing, and Debugging","s":"After you add a new tool named `get order status`, every request returns 400 `invalid_request_error`. What is the first move?","o":[["a","Fix the request: tool names may contain only letters, digits, underscores and hyphens, so rename it (for example, `get_order_status`)"],["b","Retry with exponential backoff"],["c","Switch to a different model"],["d","Rewrite the system prompt"]],"k":["a"],"e":"A 400 is a client error caused by the request itself, and the tool name breaks the documented pattern `^[a-zA-Z0-9_-]{1,128}$` ((a)). Retries ((b)) repeat the same invalid request. The model ((c)) and the prompt ((d)) play no part in request validation.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-c4ae3a1a","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"The refund agent needs the order total, the purchase date and the customer's stated reason to decide eligibility. What should the coordinator include when it delegates the task?","x":"Customer Support Escalation System: A retailer's support system uses a coordinator agent that receives each customer conversation and delegates to three subagents: an order-lookup agent with read-only order tools, a refund agent that can issue refunds, and a policy agent that searches the returns-policy knowledge base. Company policy: refunds above $250 need a human's approval, and customers can come back to an open conversation within 7 days.","o":[["a","The specific facts the refund agent needs, written into the delegation prompt: order id, total, purchase date and the customer's stated reason"],["b","Nothing extra, because subagents can read the coordinator's conversation history"],["c","The full raw transcript plus every prior tool output, so the refund agent misses nothing"],["d","An instruction for the refund agent to ask the customer to repeat the details"]],"k":["a"],"e":"Subagents in a hub-and-spoke design start with their own context window and see only what the coordinator passes to them, so (a) is the working design: the minimum necessary context, stated explicitly. (b) assumes an inheritance that doesn't exist. (c) spends tokens and attention on material the decision doesn't need, which is where lost-in-the-middle errors start. (d) makes the customer pay for a gap the coordinator could close with facts it already has.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-585bbcd5","c":"CCAR-F","d":"Context Management & Reliability","s":"Which TWO events should trigger a handoff to a human agent? (Select TWO)","x":"Customer Support Escalation System: A retailer's support system uses a coordinator agent that receives each customer conversation and delegates to three subagents: an order-lookup agent with read-only order tools, a refund agent that can issue refunds, and a policy agent that searches the returns-policy knowledge base. Company policy: refunds above $250 need a human's approval, and customers can come back to an open conversation within 7 days.","o":[["a","The customer asks to speak to a person"],["b","The customer requests a $400 refund for an order the policy covers"],["c","The customer writes in capital letters and says they are furious about a covered $90 refund"],["d","The model reports a confidence score of 0.62 on its eligibility decision"],["e","Answering the customer's question takes three tool calls"]],"k":["a","b"],"e":"An explicit request for a human ((a)) is a standing escalation trigger, and the $400 refund ((b)) crosses the $250 approval threshold, which makes the handoff mandatory under policy. Sentiment alone ((c)) is no trigger when the request sits inside clear policy; the agent can resolve it while acknowledging the frustration. Self-reported confidence ((d)) is poorly calibrated and makes an unreliable trigger. Task complexity ((e)) is the agent's job.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-45726f0f","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"The policy agent's knowledge-base search sometimes fails because the search service times out, and sometimes finds nothing because no policy covers the case. Both situations currently return an empty list. How should the tool respond instead?","x":"Customer Support Escalation System: A retailer's support system uses a coordinator agent that receives each customer conversation and delegates to three subagents: an order-lookup agent with read-only order tools, a refund agent that can issue refunds, and a policy agent that searches the returns-policy knowledge base. Company policy: refunds above $250 need a human's approval, and customers can come back to an open conversation within 7 days.","o":[["a","Return a structured error for the timeout (error type, retryable: true, what was attempted) and a successful empty result for the no-match case"],["b","Keep returning an empty list in both cases and let the agent retry"],["c","Raise an exception in both cases so the coordinator ends the conversation"],["d","Return the closest-matching policy in both cases so the agent always has something to cite"]],"k":["a"],"e":"(a) separates a transient failure from a valid empty result, and the two need different recovery: retry the search, or tell the customer no policy applies. With (b), the agent can't tell an outage from a real answer and may report that no policy covers the case during an outage. (c) ends conversations over a recoverable timeout. (d) invents relevance, which leads the agent to cite a policy that doesn't apply.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-93dcc5d9","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"A customer returns four days later to continue a conversation about a pending refund. Separately, a supervisor wants to test a different resolution on a copy of that conversation without changing what the customer sees. Which pairing fits?","x":"Customer Support Escalation System: A retailer's support system uses a coordinator agent that receives each customer conversation and delegates to three subagents: an order-lookup agent with read-only order tools, a refund agent that can issue refunds, and a policy agent that searches the returns-policy knowledge base. Company policy: refunds above $250 need a human's approval, and customers can come back to an open conversation within 7 days.","o":[["a","Resume the customer's session so the full history is restored, and fork a separate copy for the supervisor"],["b","Fork the session for the customer and resume it for the supervisor"],["c","Resume the same session for both"],["d","Start fresh sessions for both and paste the last assistant message into each system prompt"]],"k":["a"],"e":"Resuming continues a session with its history intact, which is what the returning customer needs. Forking creates an independent branch from the same history, and changes in the fork never flow back, which is what the supervisor needs. (a) matches both. (b) swaps the two. (c) lets the supervisor's experiment change the customer's conversation. (d) throws away most of the context and relies on one message to carry it.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-da62b1bc","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"Which execution pattern fits the scanning stage and the report stage?","x":"Multi-Repository Security Audit: A security team runs a nightly audit across 40 repositories. A coordinator spawns one scanner subagent per repository. Each scanner has `Read`, `Grep` and `Glob` plus a dependency-check tool. The coordinator merges the findings into one report for the morning stand-up and opens tickets for new critical issues.","o":[["a","Fan out the 40 scans in parallel, because they are independent, then run one merge step that builds the report from normalized results"],["b","Scan sequentially so each scanner can learn from the previous one's findings, then write the report in parallel sections"],["c","Use one agent that scans all 40 repositories in a single context so it can spot cross-repository patterns"],["d","Run several report writers in parallel and concatenate their outputs"]],"k":["a"],"e":"Independent work runs in parallel and dependent work runs in sequence, so the hybrid in (a) matches the data dependencies: the scans don't need each other, and the report needs all of them. (b) serializes independent work and slows the audit for no gain. (c) pushes 40 repositories into one context, which degrades attention and turns one failure into a total failure. (d) produces a report with no single view of the findings, which is what the merge step exists for.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-e7351b85","c":"CCAR-F","d":"Context Management & Reliability","s":"Last night the audit crashed at repository 27. The rerun started again from repository 1 and opened duplicate tickets for findings already reported. Which TWO changes fix this? (Select TWO)","x":"Multi-Repository Security Audit: A security team runs a nightly audit across 40 repositories. A coordinator spawns one scanner subagent per repository. Each scanner has `Read`, `Grep` and `Glob` plus a dependency-check tool. The coordinator merges the findings into one report for the morning stand-up and opens tickets for new critical issues.","o":[["a","Checkpoint progress to a manifest file (completed repositories, pending repositories, results so far) and resume from it after a crash"],["b","Make ticket creation idempotent, for example keyed by repository and finding id, so a replay can't create duplicates"],["c","Give the scanners larger context windows so they remember the previous run"],["d","Ask the coordinator at startup which repositories it already finished"],["e","Run the audit weekly instead of nightly"]],"k":["a","b"],"e":"A manifest ((a)) lets the restarted coordinator continue from repository 27, and idempotent side effects ((b)) make any replayed step harmless; together they turn a crash into a delay. Context windows ((c)) don't survive a process crash, and the coordinator has no memory of the previous run to ask about ((d)), because the API is stateless. Running less often ((e)) leaves the failure in place.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-89b61bd3","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"An engineer proposes giving every scanner the full tool set, including `Write`, `Bash` and the ticketing tool, 'in case they need it.' What is the best response?","x":"Multi-Repository Security Audit: A security team runs a nightly audit across 40 repositories. A coordinator spawns one scanner subagent per repository. Each scanner has `Read`, `Grep` and `Glob` plus a dependency-check tool. The coordinator merges the findings into one report for the morning stand-up and opens tickets for new critical issues.","o":[["a","Keep each scanner on the read-only tools its job needs, and let only the coordinator open tickets from the merged findings"],["b","Accept the proposal, because more tools make the scanners more capable"],["c","Give the scanners every tool and add a system-prompt rule forbidding writes"],["d","Replace the scanner tools with Bash alone, since Bash can do everything the other tools do"]],"k":["a"],"e":"Least privilege scopes each agent to what its responsibility requires. (a) also keeps tool selection accurate and stops a misbehaving scanner from changing code or opening tickets. (b) widens the blast radius and adds selection noise for capabilities nobody uses. (c) relies on a probabilistic instruction to restrain a capability that should never be there. (d) hands the scanners the broadest tool of all.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-9476ffe6","c":"CCAR-F","d":"Context Management & Reliability","s":"The morning report said 'No critical issues found across all repositories.' The team later learns that six scanners hit their token budgets and skipped their largest files. What should the report format have required?","x":"Multi-Repository Security Audit: A security team runs a nightly audit across 40 repositories. A coordinator spawns one scanner subagent per repository. Each scanner has `Read`, `Grep` and `Glob` plus a dependency-check tool. The coordinator merges the findings into one report for the morning stand-up and opens tickets for new critical issues.","o":[["a","A coverage annotation from every scanner (files reviewed, files skipped with reasons, coverage counts) carried into the merged report"],["b","A confidence score from each scanner"],["c","A longer narrative summary from each scanner"],["d","Nothing; the scanners needed a more capable model"]],"k":["a"],"e":"Without explicit coverage, 'no issues found' can't be told apart from 'no issues found in the part that ran.' (a) makes the gap visible so the skipped files can be queued for a focused pass. Self-reported confidence ((b)) is poorly calibrated and says nothing about what was skipped. A longer summary ((c)) adds words without the counts. A stronger model ((d)) can still hit a budget, and the report would still hide it.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-cbcff841","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"After the first tool call, every follow-up request in your agent loop fails with a 400 error. Here is how the loop builds the next request. What is wrong?\n\n```python\nresponse = client.messages.create(model=MODEL, max_tokens=1024,\n                                  tools=tools, messages=messages)\nif response.stop_reason == \"tool_use\":\n    call = next(b for b in response.content if b.type == \"tool_use\")\n    result = run_tool(call.name, call.input)\n    messages.append({\"role\": \"user\", \"content\": [{\n        \"type\": \"tool_result\",\n        \"tool_use_id\": call.id,\n        \"content\": result,\n    }]})\n```","o":[["a","The assistant turn containing the `tool_use` block is never appended, so the `tool_result` refers to a call the next request doesn't contain"],["b","`tool_result` blocks belong in the system prompt"],["c","`max_tokens` is too low for a tool loop"],["d","The loop should set `tool_choice` to `any` after the first call"]],"k":["a"],"e":"The API is stateless, so each request must carry the whole exchange: the assistant message with the `tool_use` block comes first, then the user message with the matching `tool_result` ((a)). Without it, the `tool_use_id` points at nothing. (b) misplaces tool results, which go in a user turn. (c) and (d) change settings that have nothing to do with a malformed history.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-fc3ae2f4","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"Your research agent uses the server-side web search tool. Some responses come back with `stop_reason` `pause_turn`, and the loop treats them as finished, returning half-done research. What is the correct handling?","o":[["a","Send a follow-up request with the paused assistant response appended as-is, so Claude can continue the server-side work"],["b","Treat `pause_turn` the same as `end_turn`"],["c","Run the web search locally and return a `tool_result` for it"],["d","Raise `max_tokens` and send the original request again"]],"k":["a"],"e":"`pause_turn` means a server-side tool loop reached its iteration limit mid-task. The documented handling is (a): return the response as the latest assistant turn, and Claude picks up where it stopped. (b) is the bug in the question. (c) treats a server tool like a client tool; there is no `tool_use` for your code to answer. (d) restarts the work and pays for it twice.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-6c911597","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"A team answers one-line FAQ questions from a two-page policy with a six-subagent pipeline: retriever, reader, drafter, tone checker, fact checker and formatter. Answers take 25 seconds and cost far more than expected. What is the best change?","o":[["a","Collapse it to a single model call with the policy in context, plus a lightweight validation step if needed"],["b","Run the six subagents in parallel under a coordinator"],["c","Move every subagent to the most capable model to cut retries"],["d","Cache each subagent's output"]],"k":["a"],"e":"This is over-decomposition: the task is small, single-domain and fits in one context, so the subagents add orchestration cost without any isolation benefit, and (a) removes the overhead. Parallelizing ((b)) doesn't fit a chain where each step needs the previous step's output. (c) raises the cost of a design that shouldn't exist. (d) helps only with repeated identical questions and leaves the latency of the chain in place.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-a7fbca43","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"A payments service's error rate spiked. The cause could be in code, configuration, infrastructure or a third-party API, and what to check next depends on what each check finds. How should the coordinator decompose the investigation?","o":[["a","Dynamic decomposition: plan the next subtasks from each finding, with a token budget and iteration cap enforced in code as safety nets"],["b","A fixed pipeline that runs the four checks in a set order"],["c","Run every conceivable check in parallel with no coordinator"],["d","One prompt asking Claude for the root cause"]],"k":["a"],"e":"Open-ended investigations, where the next step depends on what you just learned, call for dynamic decomposition. Because that pattern costs more and can wander, (a) pairs it with limits enforced outside the model. A fixed pipeline ((b)) suits workflows that are known in advance. (c) wastes effort and leaves nobody to connect the findings. (d) asks for an answer without giving the model any way to gather evidence.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-81dbdc4d","c":"CCAR-F","d":"Agentic Architecture & Orchestration","s":"Long research tasks sometimes use ten times the expected tokens. Which TWO belong in a reliable token-budget design? (Select TWO)","o":[["a","Track cumulative input and output tokens from each response's usage field inside the loop"],["b","Stop the loop in code when the budget is reached, with a wrap-up instruction injected at about 80% of the budget"],["c","A system-prompt instruction asking Claude to stay under 50,000 tokens"],["d","Asking Claude each turn how many tokens it has used so far"],["e","Setting `max_tokens` to 50 on every call"]],"k":["a","b"],"e":"Budgets are enforced from outside the model: measure from the usage field ((a)) and act on the measurement with a soft warning and a hard stop ((b)). An instruction ((c)) and the model's own estimate ((d)) are probabilistic and unmeasured. A tiny `max_tokens` ((e)) truncates every response, so turns end at the cap before they finish.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-049582a2","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"A team's MCP server should (1) let Claude create Jira tickets, (2) expose the team's API schema files so a user can attach them as context, and (3) provide a reusable 'triage this incident' template with the team's severity rubric. Which MCP primitives fit, in that order?","o":[["a","Tool, resource, prompt"],["b","Tool, tool, tool"],["c","Resource, tool, prompt"],["d","Prompt, resource, tool"]],"k":["a"],"e":"Creating a ticket is an action, so it's a tool. Schema files are read-only data for the client to browse and attach, so they're a resource. The packaged triage template is a prompt. (a) matches action, data and know-how in that order. (b) turns data and a template into callable functions. (c) and (d) put the action in the wrong primitive.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-11e68c4a","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"Every developer on a team should get the same internal MCP server in Claude Code, and the server needs an API token. Which TWO choices are correct? (Select TWO)","o":[["a","Define the server in the project's `.mcp.json` and commit it to the repository"],["b","Reference the token in `.mcp.json` as `${INTERNAL_API_TOKEN}` and have each developer set that environment variable"],["c","Paste the raw token into `.mcp.json` so setup is a single step"],["d","Have each developer add the server with local scope by following a wiki page"],["e","Put the token in `CLAUDE.md` so Claude can pass it to the server"]],"k":["a","b"],"e":"Project scope ((a)) is the configuration that reaches the whole team through version control, and environment variable expansion ((b)) keeps the secret out of the repository. (c) commits a credential. (d) relies on every developer repeating a manual step, and local scope never propagates. (e) puts a secret into the model's context, where it can leak through outputs or logs.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-5c263551","c":"CCAR-F","d":"Tool Design & MCP Integration","s":"When users ask to change their email address, Claude often calls `get_customer` instead of `update_customer`, then tells the user the change is done. Both tools exist. What is the first fix?","o":[["a","Rewrite both descriptions: what each tool does, when to use it, and when to use the other one instead, with `get_customer` described as read-only"],["b","Rename `get_customer` to `fetch_customer`"],["c","Add a system-prompt line telling Claude to use `update_customer` for updates"],["d","Remove `get_customer` from the agent"]],"k":["a"],"e":"Claude selects tools mainly from their descriptions, so overlapping or vague descriptions are the first thing to fix ((a)), and the boundary statements ('to change a record, use `update_customer`') are what resolve this confusion. A rename ((b)) changes little while the descriptions stay vague. A system-prompt patch ((c)) is weaker than fixing the routing signal itself. Removing the read tool ((d)) breaks every legitimate lookup.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-df30b8d6","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"Your team wants every file Claude edits to be formatted with Prettier immediately after each edit, for everyone working in the repository. Which configuration does that?","o":[["a","A `PostToolUse` hook in the committed `.claude/settings.json`, matching `Edit|Write`, that runs Prettier on the edited file"],["b","A `PreToolUse` hook on `Edit` that runs Prettier"],["c","A `CLAUDE.md` line: 'Run Prettier after every edit'"],["d","A hook in each developer's `~/.claude/settings.json`"]],"k":["a"],"e":"Formatting has to run after the file changes, which is `PostToolUse`, and the committed project settings file shares the hook with the whole team, so (a) covers both requirements. (b) runs before the edit exists. (c) is guidance Claude may skip, while a hook runs every time. (d) works only for developers who set it up themselves.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-b7808650","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"A team requires that Claude never ends its work while the test suite is failing. Which hook enforces this?","o":[["a","A `Stop` hook that runs the tests and exits with code 2, printing the failures to stderr, when any test fails"],["b","A `SessionEnd` hook that runs the tests"],["c","A `UserPromptSubmit` hook that runs the tests before each prompt"],["d","A `PostToolUse` hook that runs the tests after every file read"]],"k":["a"],"e":"Exit code 2 from a `Stop` hook prevents Claude from stopping and feeds the stderr text back, so Claude keeps working on the failures ((a)). `SessionEnd` ((b)) fires as the session closes and can't block anything. (c) tests before the work happens. (d) runs constantly at the wrong moment and can't stop Claude from finishing.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-8562d049","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"A `PostToolUse` hook on `Write` scans each file Claude writes. It finds an API key in a file Claude just wrote and exits with code 2. What happens?","o":[["a","The file has already been written; Claude receives the hook's stderr message and can act on it, for example by removing the key"],["b","The write is cancelled and the file is never created"],["c","Claude Code shuts down the session"],["d","Nothing happens, because exit code 2 is ignored for `PostToolUse`"]],"k":["a"],"e":"`PostToolUse` fires after the tool has run, so it can't undo the write; exit code 2 shows its stderr to Claude ((a)). To stop the write itself, the check belongs in a `PreToolUse` hook, where exit code 2 blocks the call, which is the behavior (b) describes. (c) and (d) describe behaviors that don't exist.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-8803d330","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"A developer asks Claude Code to migrate 40 files from a callback-based API client to async/await. The change touches shared types, and there are two reasonable migration strategies. What is the best way to start?","o":[["a","Plan Mode: let Claude explore the codebase and propose a migration plan to review before any file changes"],["b","Direct execution, file by file, fixing problems as they appear"],["c","One prompt for the whole change, then review the final diff"],["d","A `CLAUDE.md` rule saying 'use async/await'"]],"k":["a"],"e":"Multi-file, cross-cutting changes with more than one valid approach are Plan Mode's case ((a)): the strategy gets agreed before 40 files move. (b) and (c) commit to an approach before anyone has compared the options, and a wrong choice is expensive to unwind. (d) states a preference without planning the migration.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-6d66f8de","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"A team's dependency-audit skill prints thousands of lines of output, and teammates complain it floods the main conversation. Which frontmatter change fixes this?","o":[["a","`context: fork`, so the skill runs in an isolated subagent and returns its result"],["b","`disable-model-invocation: true`"],["c","`allowed-tools: Read`"],["d","`model: haiku`"]],"k":["a"],"e":"`context: fork` ((a)) runs the skill in its own subagent context, so the verbose work stays out of the main conversation. (b) only stops Claude from invoking the skill automatically; the output still floods the conversation whenever someone runs it. (c) changes which tools are pre-approved and (d) changes the model, and neither moves the output.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-4a55d062","c":"CCAR-F","d":"Claude Code Configuration & Workflows","s":"In a monorepo, files under `services/payments/` follow strict rules (all amounts in integer cents, no floats). The rules confuse Claude when it works on the frontend. Which TWO placements load these rules only when Claude works in the payments code? (Select TWO)","o":[["a","A file in `.claude/rules/` with `paths: [\"services/payments/**\"]` in its frontmatter"],["b","A `CLAUDE.md` file inside `services/payments/`"],["c","A section titled 'Payments only' in the root `CLAUDE.md`"],["d","Each developer's `~/.claude/CLAUDE.md`"],["e","The project's `.mcp.json`"]],"k":["a","b"],"e":"A path-scoped rule ((a)) loads when Claude reads or edits a matching file, and a subdirectory `CLAUDE.md` ((b)) loads on demand when Claude works with files in that directory. The root `CLAUDE.md` ((c)) loads in every session, frontend work included. (d) is personal and reaches nobody else. (e) configures MCP servers and holds no instructions.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-bcbb1dc1","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A code-review prompt says 'Be thorough but avoid nitpicks.' Reviews flag style issues inconsistently and miss SQL injection. Which rewrite fixes the cause?","o":[["a","'Report only these issues: SQL injection, XSS, authentication bypass and secrets in code. Report high or critical severity only. Do not comment on formatting or naming.'"],["b","'Be extremely thorough and never miss anything.'"],["c","'Be conservative with your comments.'"],["d","'You are a world-class senior security engineer.'"]],"k":["a"],"e":"Vague instructions produce inconsistent behavior because the model has to guess the threshold. (a) names the categories, the severity floor and the exclusions, and anyone reading a review can check whether it followed them. (b) and (c) push the same vague guidance in two directions. A role line ((d)) without criteria leaves the same guesswork.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-34e445ca","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A classifier should flag support tickets that mention a physical safety risk. In testing it flags every ticket containing the word 'fire', including 'firewall rules reset after update.' What is the best few-shot improvement?","o":[["a","Two to four examples that include the firewall ticket labeled not-safety with a one-line reason, a genuine safety ticket, and an ambiguous case"],["b","Twenty examples of genuine safety tickets"],["c","An instruction: 'Don't be fooled by keywords.'"],["d","A lower temperature"]],"k":["a"],"e":"Few-shot examples teach reasoning and edge cases best when they include something the model should leave alone, so the tricky negative in (a) is the example that matters. (b) piles on positives and teaches nothing about the false positives. (c) is vague guidance. Temperature ((d)) changes randomness and leaves the misunderstanding in place.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-52dc8e58","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"Your team plans to use structured outputs (a JSON schema in `output_config.format`) for invoice extraction. Which TWO statements about this feature are true? (Select TWO)","o":[["a","Constrained decoding makes the response valid JSON that matches the schema's structure and types"],["b","A refusal or a `max_tokens` cutoff can still produce output that doesn't match the schema, so check `stop_reason`"],["c","It guarantees the extracted values are correct for the source document"],["d","It removes the need to validate business rules, such as totals matching line items"],["e","It works only when `tool_choice` forces a specific tool"]],"k":["a","b"],"e":"Structured outputs guarantee format: valid, schema-compliant JSON ((a)), with the documented exceptions of refusals and truncation ((b)). Format says nothing about whether the values are right, so semantic checks such as totals and dates stay in your pipeline, which rules out (c) and (d). (e) confuses the feature with forced tool use; structured outputs are requested through `output_config.format`.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-552db0f4","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"An extraction fails validation because `invoice_date` came back as 2026-04-31, a date that doesn't exist. What should the retry request contain?","o":[["a","The original document, the failed output, and the specific error ('`invoice_date` 2026-04-31 is not a valid date'), with an instruction to correct only that field"],["b","The original document again with no other changes"],["c","The failed output and the words 'try again'"],["d","The same request sent to a more capable model"]],"k":["a"],"e":"A useful retry tells the model exactly what failed and gives it the source to fix it against ((a)). (b) repeats the conditions that produced the error. (c) removes the source the model needs to correct the date. (d) changes the model without telling it what went wrong.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-92ef7006","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"A product team wants to move its live chat assistant to the Message Batches API to cut costs in half. What is the right assessment?","o":[["a","Reject it: batches carry no latency guarantee (most finish within an hour, some take up to 24), so a waiting user can't be served; cut costs with prompt caching or by routing routine messages to a cheaper tier"],["b","Approve it: the same quality at half the price"],["c","Approve it, provided the app polls for results every second"],["d","Reject it, because batch requests can't include a system prompt"]],"k":["a"],"e":"The batch discount comes with asynchronous processing and no latency guarantee, which rules it out for anyone waiting on an answer ((a)). (b) ignores the latency. Polling ((c)) doesn't speed up processing. (d) is false: batch requests take the same parameters as regular Messages requests.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-8cde18d8","c":"CCAR-F","d":"Prompt Engineering & Structured Output","s":"One prompt asks Claude to extract 30 fields from a contract, normalize every currency, classify the risk clauses and write an executive summary. Results vary from run to run, and errors are hard to trace. What is the best restructuring?","o":[["a","A chain of focused prompts (extract, validate, normalize, classify, summarize), each with its own instructions and checks"],["b","The same single prompt with each requirement marked IMPORTANT"],["c","The same single prompt on a more capable model"],["d","Ask for the executive summary first, then the fields"]],"k":["a"],"e":"Prompt chaining gives each stage one job and a validation point, so a failure shows up in the stage that caused it ((a)). Emphasis ((b)) doesn't reduce the number of jobs in one prompt. A stronger model ((c)) may help a little and leaves errors untraceable. Reordering ((d)) builds the summary on fields nobody has checked yet.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-0389c7b2","c":"CCAR-F","d":"Context Management & Reliability","s":"A knowledge-base Q&A agent receives 40 retrieved passages per question. The passage with the answer usually lands near the middle, and answers often miss it. Which TWO changes address this? (Select TWO)","o":[["a","Re-rank the passages and pass only the most relevant few"],["b","Put the passages first and the question and instructions at the end of the prompt"],["c","Switch to a model with a larger context window"],["d","Retrieve 80 passages instead of 40"],["e","Raise the temperature"]],"k":["a","b"],"e":"Attention is weakest in the middle of long contexts, so the fixes shrink the middle and move what matters to the edges: fewer, better passages ((a)), and long material first with the question last, which Anthropic's long-context guidance recommends ((b)). A bigger window ((c)) and more passages ((d)) make the middle longer. Temperature ((e)) affects randomness and does nothing for attention.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-01bfbd4f","c":"CCAR-F","d":"Context Management & Reliability","s":"Two internal documents disagree about the warranty period: a 2024 policy says 12 months and a 2026 update says 24 months. What should the agent's answer do?","o":[["a","Give the answer with attribution: both values, their documents and dates, the newer one identified as likely current, and the conflict flagged for review"],["b","State 24 months without mentioning the conflict, because the newer document wins"],["c","Average the two and state 18 months"],["d","Decline to answer until someone fixes the documents"]],"k":["a"],"e":"Provenance keeps each claim tied to its source and surfaces conflicts instead of settling them silently ((a)). Silently picking one value ((b)) is the tested anti-pattern even when the choice happens to be right, because nobody learns that the documents disagree. (c) produces a number neither source supports. (d) withholds an answer the agent can give with a caveat.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-16b785fe","c":"CCAR-P","d":"Solution Design and Architecture","s":"A support team wants answers to product questions grounded in a 300-page manual. Questions are single-turn, and the manual is updated monthly. What is the simplest sufficient architecture?","o":[["a","An augmented LLM: retrieval over the manual feeding a single model call that cites the passages it used"],["b","A multi-agent research system with a planner and three specialists"],["c","An autonomous agent that browses the manual page by page"],["d","A model fine-tuned on the manual every month"]],"k":["a"],"e":"One well-scoped, grounded call meets the requirement, so retrieval plus a single call is the simplest sufficient pattern ((a)). (b) and (c) add autonomy the task doesn't need, with the cost and latency to match. Monthly fine-tuning ((d)) is heavy, slower to update than re-indexing, and gives no citations.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-e02365a6","c":"CCAR-P","d":"Solution Design and Architecture","s":"Which architecture proposal for an invoice-processing assistant is complete?","o":[["a","Email intake and OCR; extraction with schema validation; posting to the ERP with an exceptions queue; per-field accuracy evals, user corrections and monitoring fed back into prompt and model decisions"],["b","Email intake and OCR; extraction with the most capable model; posting to the ERP"],["c","Extraction with schema validation; posting to the ERP; a dashboard of monthly volume"],["d","Email intake; a multi-agent extraction team; posting to the ERP; a launch announcement"]],"k":["a"],"e":"A complete architecture has input, processing, output and a feedback loop that turns evals, user corrections and monitoring into design changes ((a)). (b) has no feedback loop. (c) has no input stage, and a volume dashboard measures activity without feeding quality back. (d) adds complexity and still has no feedback loop.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-e16b93e2","c":"CCAR-P","d":"Solution Design and Architecture","s":"Two designs meet the accuracy target. Design 1 uses the top tier: p95 latency 6 seconds, $0.09 per request. Design 2 routes between the fast and balanced tiers: p95 latency 2 seconds, $0.02 per request. The client's stated constraint is a 3-second p95 SLA at 2 million requests a month. Which design, and why?","o":[["a","Design 2, because it meets the latency SLA and the cost pillar at the same accuracy"],["b","Design 1, for quality headroom"],["c","Run both in production indefinitely"],["d","Postpone the decision until a newer model is released"]],"k":["a"],"e":"When both options meet accuracy, the stated business constraint decides, and only Design 2 meets the 3-second SLA, at about $40,000 a month against $180,000 ((a)). (b) breaks the SLA. (c) doubles cost and complexity for no reason. (d) ignores a decision the data already supports.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-baf57703","c":"CCAR-P","d":"Solution Design and Architecture","s":"A due-diligence system must analyze each target company's financials, legal filings and press coverage. The three analyses are independent, and each needs different tools and sources. Which design fits?","o":[["a","An orchestrator with three scoped subagents running in parallel, followed by a synthesis step"],["b","One agent holding all the tools for all three analyses"],["c","One agent doing the three analyses in sequence"],["d","Three separate systems whose reports nobody combines"]],"k":["a"],"e":"Independent subtasks with different tool needs are what justifies decomposition: each subagent gets a narrow toolset and its own context, and the orchestrator merges the results ((a)). (b) is capability bloat. (c) gives up parallelism and mixes three contexts. (d) skips the synthesis the client actually needs.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-41927f6f","c":"CCAR-P","d":"Solution Design and Architecture","s":"A global retailer's policy assistant covers 14 regions. Each region's policies differ and are owned by different teams. Answers mix rules from different regions. What is the best design change?","o":[["a","Partition by data domain: tag documents with their region and filter retrieval by the user's region before semantic search"],["b","Fourteen agents that negotiate with each other on every question"],["c","Put all 14 regions' policies in every request"],["d","Ask users to mention their region and change nothing else"]],"k":["a"],"e":"The data has a clean partition, so filtering on region metadata keeps other regions' rules out of the context ((a)). (b) adds coordination machinery to a retrieval problem. (c) is context stuffing. (d) leaves the mixed retrieval in place.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-6d4bef47","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"Which TWO workloads benefit most from prompt caching? (Select TWO)","o":[["a","An agent loop that resends the same 12,000-token system prompt and tool definitions on every turn"],["b","An endpoint where many users ask questions about the same 50-page policy within minutes of each other"],["c","A weekly job that sends one unique 3,000-token prompt"],["d","Requests whose first line is the current timestamp"],["e","Single requests shorter than the minimum cacheable length"]],"k":["a","b"],"e":"Caching pays off when a long, stable prefix repeats within the cache lifetime ((a), (b)). A weekly unique prompt ((c)) never repeats in time. A timestamp at the start ((d)) breaks the prefix on every request. Prompts under the minimum length ((e)) are never cached.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-f68c06ad","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"An eligibility step must apply six interacting rules. Accuracy is the priority, and the latency budget is generous. Which prompting approach fits?","o":[["a","Have the model reason through the rules step by step (or enable thinking) before deciding, with each rule stated as an explicit criterion, then validate the decision"],["b","A zero-shot prompt kept as short as possible"],["c","Few-shot examples alone, with no stated rules"],["d","A lower temperature"]],"k":["a"],"e":"Multi-step logic benefits from explicit reasoning before the answer, and the generous latency budget covers its cost ((a)). Zero-shot ((b)) suits simple, unambiguous tasks. Examples ((c)) teach format and edge cases, and six interacting rules still need to be stated. Temperature ((d)) adds no reasoning.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-06cf4d33","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"An enterprise assistant's system prompt has grown to 60,000 tokens of procedures for 40 business processes, and most requests need one or two of them. Latency and cost are high, and instruction-following has slipped. What is the best restructuring?","o":[["a","Keep the system prompt to the core role and rules, and package each procedure as a Skill or retrievable module that loads only when relevant"],["b","Mark the most important procedures in capitals"],["c","Move to a model with a larger context window"],["d","Build 40 separate assistants and make users choose"]],"k":["a"],"e":"Loading procedures on demand keeps the context small and focused, which improves attention, cost and latency together ((a)). Emphasis ((b)) doesn't shrink the prompt. A bigger window ((c)) holds more of the same dilution. (d) moves the routing problem onto users.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-77981120","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"Downstream systems consume the assistant's JSON, and occasional schema violations cause failed transactions. Which change addresses this at the source, and what still needs checking?","o":[["a","Structured outputs with the integration schema, which guarantees schema-valid JSON, plus semantic validation of the values and handling of the refusal and `max_tokens` stop reasons"],["b","A retry loop and nothing else"],["c","A stronger instruction to follow the schema"],["d","A regex that repairs broken JSON"]],"k":["a"],"e":"Constrained decoding removes schema violations at the source, and semantic checks plus stop-reason handling cover what it doesn't guarantee ((a)). Retries ((b)) and instructions ((c)) reduce failures without eliminating them. Regex repair ((d)) guesses at intent and can corrupt data quietly.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-a9a9586e","c":"CCAR-P","d":"Integration","s":"A procurement agent must get quotes from a supplier's own AI agent, which runs on the supplier's systems with its own tools, policies and reasoning. Which integration mechanism fits?","o":[["a","Agent-to-agent delegation over a defined protocol, with explicit request and response contracts, authentication, and failure isolation"],["b","An MCP server that gives your agent direct access to the supplier's database"],["c","A direct API call to Claude with the supplier's price list pasted into the prompt"],["d","A shared system prompt that both companies edit"]],"k":["a"],"e":"Two autonomous systems with separate owners, tools and policies call for delegation between agents, with contracts and isolation so either side can fail independently ((a)). (b) bypasses the supplier's agent and policies and assumes access you won't get. (c) works only if you already have current prices, which is what you're asking for. (d) merges two organizations' control into one prompt.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-b97b79f9","c":"CCAR-P","d":"Integration","s":"One internal app sends support tickets to Claude for tagging. One team owns it, and no reuse is planned. A platform engineer proposes building an MCP server first. What is the right assessment?","o":[["a","Use a direct API integration now; MCP adds a protocol layer and maintenance without a reuse need, so revisit it if other surfaces need the capability"],["b","Build the MCP server, since every integration should use MCP"],["c","Use agent-to-agent delegation"],["d","Fine-tune a tagging model instead"]],"k":["a"],"e":"MCP pays off when one capability serves many clients or surfaces, and one app with one owner is the direct-API case ((a)). (b) adds maintenance for a benefit that doesn't exist yet. (c) adds autonomous-system machinery to a single call. (d) skips a simpler option that works.","es":0,"src":"preporato/claude-certification-guide"},{"id":"preporato-14c129fc","c":"CCAR-P","d":"Integration","s":"Which TWO observations are signs of capability bloat in a production agent? (S
