and an onboarding path that new engineers follow"]],"k":["d"],"e":"Shared, versioned configuration with an onboarding path is what makes adoption stick","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-fd8907cb","c":"CCAR-P","d":"Integration","s":"Which change best reduces risk in an agent that can both read and modify production records?","o":[["a","Separating read and write capabilities, granting write access only where the role requires it, and gating writes behind explicit approval"],["b","Logging modifications for later review"],["c","Requiring a longer system prompt about caution"],["d","Running the agent during business hours only"]],"k":["a"],"e":"Least privilege plus approval gates on writes reduces the surface rather than monitoring it","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-349a4eb2","c":"CCAR-P","d":"Integration","s":"A client requires that inference run inside their own AWS account. What does this determine?","o":[["a","The model family only"],["b","That a data processing agreement is sufficient"],["c","Deployment through Amazon Bedrock in the client's account and region"],["d","That request logging must be disabled"]],"k":["c"],"e":"Running inside the client's own cloud boundary is what the requirement describes. A contract (B) and logging settings (D) do not keep the data in the account, and the model family (A) is a separate choice","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-24849e91","c":"CCAR-P","d":"Integration","s":"An enterprise standardised on Google Cloud wants identity and audit handled by existing controls. What follows?","o":[["a","Deploy through Vertex AI so the platform's identity, billing, and audit apply"],["b","Use the Claude API and rebuild the controls"],["c","Use Bedrock for feature parity"],["d","Let each team decide"]],"k":["a"],"e":"Aligning with the governed platform makes existing controls apply without duplication. Rebuilding (B) drifts, a different cloud (C) creates a second control plane, and per-team choice (D) removes governance","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-8c80f360","c":"CCAR-P","d":"Integration","s":"What is the main architectural benefit of routing all model traffic through one internal service?","o":[["a","Lower token prices"],["b","It removes the need for evaluation"],["c","It guarantees lower latency"],["d","Authentication, rate limiting, logging, and routing are applied consistently in one place"]],"k":["d"],"e":"A single integration point is where cross-cutting concerns are enforced and changed once. It does not change unit price (A), remove evaluation (B), or reduce latency (C)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-51519d15","c":"CCAR-P","d":"Solution Design and Architecture","s":"Two designs both satisfy the requirement; one is materially simpler. What decides?","o":[["a","The more capable design, since headroom is valuable"],["b","Whether any stated requirement needs the extra capability, against the ongoing cost of complexity"],["c","Whichever the team prefers to build"],["d","The one with more components, for flexibility"]],"k":["b"],"e":"Complexity is paid for continuously, so it must be bought by a real requirement. Headroom (A), preference (C), and speculative flexibility (D) pay that cost without justification","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-dbfbf0ab","c":"CCAR-P","d":"Solution Design and Architecture","s":"A required compliance control depends on the model behaving correctly. What is the correct judgment?","o":[["a","Acceptable if measured accuracy is very high"],["b","Not acceptable: a required control must be enforced deterministically outside the model"],["c","Acceptable with a documented residual risk"],["d","Acceptable if a larger model is used"]],"k":["b"],"e":"A control that must hold needs a guarantee, which probabilistic behavior cannot supply. High accuracy (A), documentation (C), and model size (D) do not convert a tendency into a guarantee","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-95e06e52","c":"CCAR-P","d":"Solution Design and Architecture","s":"Where should the boundary of automation be drawn in a solution that makes customer-affecting decisions?","o":[["a","Wherever the model performs well in testing"],["b","As far as the budget allows"],["c","At whatever the client requests"],["d","Where accountability for the decision sits, keeping those decisions with a person"]],"k":["d"],"e":"Accountability determines what may be automated at all, and that boundary is an architectural decision. Test performance (A), budget (B), and unexamined requests (C) do not address responsibility","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-29bc3052","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"What must exist before a solution is declared production-ready?","o":[["a","A defined success criterion and measured performance against representative data"],["b","A successful demonstration"],["c","Sign-off from the engineering team"],["d","A completed cost model"]],"k":["a"],"e":"Readiness is a measured claim against a stated bar. A demonstration (B), consensus (C), and cost (D) do not establish whether it works","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-f4ab668f","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"An evaluation set contains only cases the system already handles. What is the effect?","o":[["a","It provides a reliable quality measure"],["b","It is fine if it is large"],["c","It overstates performance and conceals the failures that matter"],["d","It matters only in regulated contexts"]],"k":["c"],"e":"An unrepresentative sample measures the wrong distribution, and size does not correct bias. It is not reliable (A), scale does not fix it (B), and the problem is general (D)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-ca049bdf","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"How should a request to log every prompt and response for audit be handled?","o":[["a","Implement it, since audit takes precedence"],["b","Decline, because logging creates risk"],["c","Log responses but not prompts"],["d","Establish what the audit requires, because prompts and responses may contain personal or confidential data"]],"k":["d"],"e":"Audit and data protection are both real, and the design must serve the audit purpose without retaining more than warranted. Blanket action (A) or refusal (B) ignores one side, and an arbitrary split (C) is unjustified","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-a08ba037","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"Who is accountable when an automated Claude workflow produces a harmful decision?","o":[["a","The model provider"],["b","The engineer who wrote the prompt"],["c","The organization that deployed it"],["d","No one, because the decision was automated"]],"k":["c"],"e":"Deploying an automated decision means owning its outcomes. The provider (A) supplies a capability, individual authorship (B) does not transfer organizational responsibility, and automation does not remove accountability (D)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-04e5249f","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"A sponsor asks for one number that shows whether the solution is working. What is the right response?","o":[["a","Give the headline accuracy figure"],["b","Give the measure tied to the decision they face, and state what it does not cover"],["c","Explain that this cannot be reduced to a number"],["d","Give the model's benchmark score"]],"k":["b"],"e":"A useful metric matches the decision and is honest about its limits. A bare accuracy figure (A) and a benchmark (D) can mislead, and refusing (C) fails the sponsor","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-39a643ee","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"A ten-user pilot is about to expand to two thousand users. What should the architect raise first?","o":[["a","Which assumptions held at ten users and may not hold at two thousand"],["b","License cost"],["c","Whether a larger model is needed"],["d","The training rollout plan"]],"k":["a"],"e":"Scale invalidates assumptions about inputs, support, and edge cases, and surfacing those is the architect's contribution. Cost (B), model size (C), and training (D) follow from knowing what breaks","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-f294cffc","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"How should a model be chosen for a solution containing several distinct tasks?","o":[["a","Match each task to the smallest model meeting its requirement, and evaluate the choices"],["b","One model everywhere, for simplicity"],["c","The largest model everywhere, for safety"],["d","The newest model everywhere"]],"k":["a"],"e":"Different tasks have different requirements, and matching each keeps cost proportionate on evidence. Uniform choices (B, C, D) optimise for convenience rather than fit","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-40787363","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"How should the context window be treated in a production design?","o":[["a","As capacity to fill as completely as possible"],["b","As a budget allocated deliberately between instructions, retrieved material, and working state"],["c","As a concern only for long documents"],["d","As a setting to increase whenever quality drops"]],"k":["b"],"e":"Context is scarce and its allocation drives quality, so it is designed. Filling it (A) dilutes, it matters beyond long documents (C), and enlarging it (D) does not fix allocation","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-c6333859","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"An organization wants consistent Claude Code practice across dozens of repositories. What is most durable?","o":[["a","A policy document circulated once"],["b","A single training session"],["c","Committed project memory and shared skills in each repository, reviewed like code"],["d","Requiring approval for every use"]],"k":["c"],"e":"Conventions persist when they live in the repository and are reviewed with the work. Policies (A) and training (B) fade, and per-use approval (D) adds friction without conveying practice","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-140ca00b","c":"CCAR-P","d":"Integration","s":"A client will not accept a solution whose behavior cannot be explained to their auditor. What does this constrain?","o":[["a","The model family only"],["b","The cost model"],["c","The architecture, which must make decisions traceable and the controls inspectable"],["d","The deployment region"]],"k":["c"],"e":"Auditability is an architectural property covering tracing and inspectable controls. Model family (A), cost (B), and region (D) do not by themselves make behavior explicable","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-83ed5f3e","c":"CCAR-P","d":"Integration","s":"What is the main risk of building directly against a single cloud's model service with no abstraction?","o":[["a","Moving later becomes expensive, because the coupling reaches into application code"],["b","Higher token cost"],["c","Lower accuracy"],["d","Slower responses"]],"k":["a"],"e":"Coupling determines the cost of change, which is the architectural concern. Cost (B), accuracy (C), and latency (D) are not consequences of the coupling itself","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-fee6475b","c":"CCAR-P","d":"Integration","s":"A solution must serve users in two regions with different data residency rules. What follows?","o":[["a","One deployment in the cheaper region"],["b","A single deployment with encryption in transit"],["c","Whichever region has the lowest latency"],["d","Separate deployments whose data stays within each region's boundary"]],"k":["d"],"e":"Residency is satisfied by keeping the data within each boundary. A single deployment (A, B) moves data across it, and latency (C) does not address the rule","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-6a958fc4","c":"CCAR-P","d":"Solution Design and Architecture","s":"A requirement is stated as make it as accurate as possible. What should the architect do?","o":[["a","Choose the largest model and optimise from there"],["b","Establish the accuracy the use case actually needs and what an error costs"],["c","Build the most complex design the budget allows"],["d","Defer the question until after the pilot"]],"k":["b"],"e":"An unbounded requirement cannot be designed against or verified, so it must be made concrete. Defaulting to maximum capability (A, C) spends without a target, and deferring (D) leaves the design unanchored","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-7e51b2f6","c":"CCAR-P","d":"Solution Design and Architecture","s":"Two components each work correctly but the system fails intermittently at their boundary. What does this suggest?","o":[["a","One component needs a larger model"],["b","The contract between them is underspecified, particularly for edge and error cases"],["c","The system needs more components"],["d","The failure is transient and can be retried"]],"k":["b"],"e":"Boundary failures between correct components point at the contract. Capability (A) and more components (C) do not define the interface, and retrying (D) hides it","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-fca3600e","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"A design proposes storing every model interaction indefinitely. What should the architect raise?","o":[["a","Nothing, retention is always safer"],["b","That storage is expensive"],["c","That it will slow the system"],["d","Why the data is needed, for how long, and what obligations retention creates"]],"k":["d"],"e":"Retention creates obligations and risk, so purpose and duration must justify it. Treating retention as free of risk (A) is the error, and cost (B) and speed (C) are minor by comparison","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-002b7e68","c":"CCAR-P","d":"Governance, Safety and Risk Management","s":"How should a solution handle the case where the model is confident and wrong?","o":[["a","Design so that consequential outputs are verified against something independent of the model"],["b","Trust the confidence signal"],["c","Ask the model to double-check"],["d","Use two models and take the agreement"]],"k":["a"],"e":"Independence is what catches confident error. Confidence (B) is not evidence, self-checking (C) is not independent, and two models can agree and both be wrong (D)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-097d6121","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"An evaluation shows 94% accuracy. What else must be known before this is actionable?","o":[["a","The model version only"],["b","The token cost of the evaluation"],["c","What the 6% look like, and what each failure costs"],["d","How long the evaluation took"]],"k":["c"],"e":"A headline rate is only meaningful alongside the shape and cost of the failures. Version (A), cost (B), and duration (D) do not describe the risk","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-01553d81","c":"CCAR-P","d":"Evaluation, Testing and Optimization","s":"What should happen when a model version is updated beneath a production solution?","o":[["a","Nothing, versions are compatible"],["b","Increase monitoring for a week"],["c","Roll back automatically if complaints rise"],["d","Re-run the evaluation suite before the change reaches production traffic"]],"k":["d"],"e":"A change to the thing that determines behavior invalidates prior measurement. Assuming compatibility (A) is unsafe, and monitoring (B) or reacting to complaints (C) detects after users are affected","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-b7f39638","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"A stakeholder asks why the solution cannot simply be fully automated. What is the most useful answer?","o":[["a","That the technology is not ready"],["b","That automation is always risky"],["c","Which specific decisions carry accountability or are unverifiable, and what automating them would risk"],["d","That the budget does not allow it"]],"k":["c"],"e":"A specific, reasoned boundary is actionable and can be revisited. Generic claims about readiness (A) or risk (B) are not, and budget (D) is not the reason","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-8d0d4ae4","c":"CCAR-P","d":"Stakeholder Communication and Lifecycle Management","s":"What should be handed over with a solution so it survives its first year?","o":[["a","The source code"],["b","The evaluation suite, the criteria, the owner, and the routine for re-checking"],["c","A recorded demonstration"],["d","A list of prompts used"]],"k":["b"],"e":"Continuity depends on being able to measure and maintain, with someone responsible. Code (A), a demonstration (C), and prompts (D) are artefacts without the means to verify them","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-8a3588a7","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"A team reports the solution has become worse, but nothing was deployed. What is the most likely explanation?","o":[["a","The inputs or the surrounding usage changed"],["b","The model degraded on its own"],["c","The prompts wore out"],["d","The evaluation was wrong originally"]],"k":["a"],"e":"Behavior changes with what is fed to it, and distribution drift is the usual cause. Models do not degrade unprompted (B), prompts do not wear out (C), and the original evaluation is not the first suspect (D)","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-cc679dba","c":"CCAR-P","d":"Claude Models, Prompting and Context Engineering","s":"How should prompts that determine production behavior be managed?","o":[["a","Versioned, owned, reviewed, and evaluated on change, like code"],["b","Edited in place when someone notices a problem"],["c","Kept in a shared document for easy editing"],["d","Frozen after launch"]],"k":["a"],"e":"Anything that determines production behavior needs the lifecycle of code. Ad hoc edits (B) and open documents (C) invite unreviewed change, and freezing (D) blocks improvement","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-a3a5dca5","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"An organization asks how to measure whether Claude Code is worth the license cost. What should be measured?","o":[["a","Number of tool invocations"],["b","Change in the delivery outcomes the tooling was adopted to improve"],["c","Number of users onboarded"],["d","Hours spent in the tool"]],"k":["b"],"e":"Value is the outcome moved, not the activity generated. Invocations (A), onboarding (C), and time in tool (D) measure usage rather than benefit","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"},{"id":"amey-e8aa213d","c":"CCAR-P","d":"Developer Productivity and Operational Enablement","s":"What most often blocks a team from getting good results from Claude Code on an existing codebase?","o":[["a","The size of the repository"],["b","The programming language"],["c","The absence of committed context describing the conventions and structure"],["d","The number of contributors"]],"k":["c"],"e":"Missing project context is the usual cause, and it is the one the team can fix. Size (A), language (B), and contributor count (D) do not by themselves prevent good results","es":0,"src":"Amey-Thakur/CLAUDE-CERTIFICATIONS"}]</script>
<script>
// Pure game engine for the duel. No DOM, no network: the host runs it and broadcasts
// the resulting state; tests run it in Node. Exposed as globalThis.DuelEngine.
;(function (root) {
  'use strict'

  const STEAL_MS = 10000
  const BASE = 100
  const SPEED_MAX = 50
  const STEAL_PTS = 50

  function hash(s) {
    let h = 0x811c9dc5
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) }
    return h >>> 0
  }
  function rng(seed) {
    let a = seed >>> 0
    return function () {
      a = (a + 0x6d2b79f5) >>> 0
      let t = a
      t = Math.imul(t ^ (t >>> 15), t | 1)
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }
  function shuffle(arr, rand) {
    const a = arr.slice()
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t }
    return a
  }

  /** Same option order on every screen: derived from the match code and question id. */
  function optionOrder(q, code) {
    return shuffle(q.o.map((o) => o[0]), rng(hash(code + '|' + q.id)))
  }

  /** Picks n questions for a cert, spread across domains, never repeating a question
   *  already used in this series (until the pool runs out). */
  function pickQuestions(bank, cert, n, seed, exclude) {
    const rand = rng(seed)
    const ex = new Set(exclude || [])
    let pool = bank.filter((q) => q.c === cert && !ex.has(q.id))
    if (pool.length < n) pool = bank.filter((q) => q.c === cert)
    const byDom = {}
    for (const q of shuffle(pool, rand)) (byDom[q.d] = byDom[q.d] || []).push(q)
    const doms = shuffle(Object.keys(byDom), rand)
    const out = []
    // round-robin across domains so a short round still mixes topics
    while (out.length < n && doms.some((d) => byDom[d].length)) {
      for (const d of doms) { if (out.length < n && byDom[d].length) out.push(byDom[d].shift()) }
    }
    return out.map((q) => q.id)
  }

  function sameSet(a, b) {
    if (!a || !b || a.length !== b.length) return false
    const s = new Set(a)
    return b.every((x) => s.has(x))
  }

  /** Points: 100 for a correct answer plus up to 50 for speed (linear on time left).
   *  A steal is worth a flat 50. Wrong or late = 0. */
  function points(correct, ms, limitMs, steal) {
    if (!correct) return 0
    if (steal) return STEAL_PTS
    const left = Math.max(0, Math.min(1, 1 - ms / limitMs))
    return BASE + Math.round(SPEED_MAX * left)
  }

  function newMatch(opts) {
    return {
      v: 1,
      code: opts.code,
      cert: opts.cert,
      mode: opts.mode, // 'sim' | 'turn'
      secs: opts.secs,
      qids: [],
      i: -1,
      phase: 'lobby', // lobby | q | steal | reveal | end
      players: [], // [{p: peer, nick, uid}]
      active: null, // turn mode: peer who must answer
      ans: {}, // peer -> {c: choice[], ms, ok, pts, st: steal?}
      sc: {}, // peer -> {pts, ok, n, ms}
      series: opts.series || {}, // key -> wins across rematches
      round: (opts.round || 0),
      startedAt: 0,
      deadline: 0, // host clock
    }
  }

  function start(m, bank, seed, now, used) {
    m.qids = pickQuestions(bank, m.cert, m.n || 10, seed, used)
    m.sc = {}
    for (const pl of m.players) m.sc[pl.p] = { pts: 0, ok: 0, n: 0, ms: 0 }
    m.round = (m.round || 0) + 1
    m.startedAt = now
    return nextQuestion(m, now)
  }

  function eligible(m) {
    if (m.phase === 'q') return m.mode === 'turn' ? [m.active] : m.players.map((p) => p.p)
    if (m.phase === 'steal') return [m.active]
    return []
  }

  function nextQuestion(m, now) {
    m.i += 1
    m.ans = {}
    if (m.i >= m.qids.length) { m.phase = 'end'; m.deadline = 0; m.active = null; return m }
    m.phase = 'q'
    m.deadline = now + m.secs * 1000
    if (m.mode === 'turn' && m.players.length) m.active = m.players[m.i % m.players.length].p
    else m.active = null
    return m
  }

  /** Applies one answer from `peer`. Returns true if accepted. */
  function answer(m, bankMap, peer, choice, ms, now) {
    if (!eligible(m).includes(peer)) return false
    if (m.ans[peer] && m.ans[peer].st === (m.phase === 'steal')) return false
    if (now > m.deadline + 1500) return false // network grace
    const q = bankMap[m.qids[m.i]]
    const steal = m.phase === 'steal'
    const limit = steal ? STEAL_MS : m.secs * 1000
    const msC = Math.max(0, Math.min(limit, Number(ms) || limit))
    const ok = sameSet(choice, q.k)
    m.ans[peer] = { c: choice.slice(0, 6), ms: msC, ok, pts: points(ok, msC, limit, steal), st: steal }
    const s = m.sc[peer] || (m.sc[peer] = { pts: 0, ok: 0, n: 0, ms: 0 })
    s.pts += m.ans[peer].pts
    if (!steal) { s.n += 1; s.ms += msC; if (ok) s.ok += 1 }
    else if (ok) s.stl = (s.stl || 0) + 1
    return true
  }

  /** Advances time-driven transitions. Returns true if the state changed. */
  function tick(m, now) {
    if (m.phase !== 'q' && m.phase !== 'steal') return false
    const need = eligible(m)
    const done = need.every((p) => m.ans[p] && m.ans[p].st === (m.phase === 'steal'))
    if (!done && now < m.deadline) return false
    // turn mode: a miss (wrong or timeout) opens a steal for the next player
    if (m.mode === 'turn' && m.phase === 'q' && m.players.length > 1) {
      const a = m.ans[m.active]
      if (!a) { // timeout counts as an attempt
        const s = m.sc[m.active]; if (s) { s.n += 1; s.ms += m.secs * 1000 }
      }
      if (!a || !a.ok) {
        const idx = m.players.findIndex((p) => p.p === m.active)
        m.stealFrom = m.active
        m.active = m.players[(idx + 1) % m.players.length].p
        m.phase = 'steal'
        m.deadline = now + STEAL_MS
        return true
      }
    }
    if (m.mode === 'sim' && m.phase === 'q') {
      for (const p of need) if (!m.ans[p]) { const s = m.sc[p]; if (s) { s.n += 1; s.ms += m.secs * 1000 } }
    }
    m.phase = 'reveal'
    m.deadline = now + 9000
    return true
  }

  function standings(m) {
    return m.players
      .map((pl) => ({ ...pl, ...(m.sc[pl.p] || { pts: 0, ok: 0, n: 0, ms: 0 }) }))
      .sort((a, b) => b.pts - a.pts || b.ok - a.ok || a.ms - b.ms)
  }

  root.DuelEngine = { hash, rng, shuffle, optionOrder, pickQuestions, sameSet, points, newMatch, start, nextQuestion, answer, tick, eligible, standings, STEAL_MS }
})(typeof globalThis !== 'undefined' ? globalThis : this)

</script>
<script>
(function () {
  'use strict'
  const E = window.DuelEngine
  const BANK = JSON.parse(document.getElementById('bank').textContent)
  const MAP = Object.fromEntries(BANK.map((q) => [q.id, q]))
  const CERTS = [
    { id: 'CCDV-F', name: 'Developer – Foundations' },
    { id: 'CCAR-F', name: 'Architect – Foundations' },
    { id: 'CCAR-P', name: 'Architect – Professional' },
  ]
  const COLORS = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)']
  const LETTERS = 'ABCDEF'

  // ---------- tiny DOM helper (textContent only; never innerHTML with data)
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue
      if (k === 'class') el.className = v
      else if (k === 'style') el.setAttribute('style', v)
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
      else el.setAttribute(k, v === true ? '' : v)
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)))
    return el
  }
  /** Inline `code` spans, rendered safely. */
  function rich(text) {
    const frag = document.createDocumentFragment()
    String(text || '').split(/(`[^`]+`)/).forEach((s) => {
      if (s.length > 2 && s[0] === '`' && s[s.length - 1] === '`') frag.append(h('code', {}, s.slice(1, -1)))
      else frag.append(document.createTextNode(s.replace(/```[a-z]*\n?/g, '')))
    })
    return frag
  }
  /** Imported explanations cite options by their original letter, e.g. "(B)". Options are
   *  shuffled per match, so rewrite each citation to the letter shown on screen. */
  function remap(text, order) {
    return String(text || '').replace(/\(([A-Fa-f])\)/g, (m, l) => {
      const i = order.indexOf(l.toLowerCase())
      return i < 0 ? m : '(' + LETTERS[i] + ')'
    })
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem('duel.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
    set(k, v) { try { localStorage.setItem('duel.' + k, JSON.stringify(v)) } catch { /* storage may be blocked */ } },
  }

  // ---------- state
  const S = {
    screen: 'home', // home | room | play
    nick: store.get('nick', ''),
    cert: store.get('cert', 'CCDV-F'),
    mode: store.get('mode', 'sim'),
    n: store.get('n', 10),
    secs: store.get('secs', 30),
    lobby: null, game: null, db: null, user: null,
    connected: false, roomAvailable: null,
    myPeer: null, myUid: null, myColor: null,
    isHost: false, hostPeer: null, code: null,
    M: null, // current match state (host = authoritative copy)
    local: { key: null, start: 0, deadline: 0, chosen: [], sent: null },
    log: [], // this round, my per-question outcome (client side)
    used: [], // question ids used in this series
    history: [], // db results
    openGames: [],
    peersInGame: [],
    profiles: {},
    msg: '',
    saved: {},
  }

  function me() { return S.code === 'solo' ? 'solo' : S.myPeer }

  // ---------- capabilities (the page works alone; the room lights up multiplayer)
  async function boot() {
    render()
    const c = window.claude && window.claude.use ? window.claude : null
    const [room, db, user] = c ? await Promise.all([c.use('room'), c.use('db'), c.use('user')]) : [null, null, null]
    S.lobby = room; S.db = db; S.user = user; S.roomAvailable = !!room
    if (!room) S.roomWhy = 'none'
    if (user) { try { S.canWrite = await user.can('data.write'); S.canEdit = await user.canEdit() } catch { /* reads never reject */ } }
    if (user) {
      const me = await user.me()
      S.myUid = me.id; S.myColor = me.color
      if (!S.nick && me.name) S.nick = me.name.split(' ')[0]
    }
    if (room) {
      room.onConnection((ok) => { S.connected = ok; render() }, (e) => { S.connected = false; S.roomAvailable = false; S.roomWhy = (e && e.code) || 'error'; render() })
      room.onPeers((ch) => {
        const mine = ch.peers.find((p) => p.sameTab)
        if (mine) S.myPeer = mine.peer
        S.openGames = ch.peers.filter((p) => !p.sameTab && p.presence && p.presence.host && p.presence.host.phase === 'lobby')
          .map((p) => ({ peer: p.peer, by: p.by, guest: p.guest, ...p.presence.host }))
        if (S.screen === 'home') render()
      })
    } else {
      S.myPeer = 'solo'
    }
    if (db) {
      db.collection('duels').orderBy('at', 'desc').limit(100).onSnapshot((snap) => {
        S.history = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
        if (S.screen === 'home' || (S.M && S.M.phase === 'end')) render()
      }, () => {})
    }
    render()
  }

  // ---------- host side
  function code() {
    const a = 'abcdefghjkmnpqrstuvwxyz23456789'
    let s = ''
    for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]
    return s
  }
  async function createGame(solo) {
    if (!S.nick.trim()) { S.msg = 'Escribe tu alias para empezar.'; render(); return }
    store.set('nick', S.nick); store.set('cert', S.cert); store.set('mode', S.mode); store.set('n', S.n); store.set('secs', S.secs)
    S.isHost = true
    S.code = solo ? 'solo' : code()
    S.M = E.newMatch({ code: S.code, cert: S.cert, mode: S.mode, secs: S.secs })
    S.M.n = S.n
    S.M.host = me()
    S.M.players = [{ p: me(), nick: S.nick.slice(0, 24), uid: S.myUid }]
    S.used = []
    if (!solo && S.lobby) {
      try {
        S.game = await S.lobby.join('duel-' + S.code, { create: true })
      } catch (e) { S.msg = 'No se pudo abrir la sala: ' + (e && e.code || 'error'); S.isHost = false; render(); return }
      S.game.presence({ nick: S.M.players[0].nick, uid: S.myUid, role: 'player' })
      S.game.onPeers((ch) => {
        S.peersInGame = ch.peers
        if (S.M.phase === 'lobby') {
          S.M.players = ch.peers
            .filter((p) => p.kind === 'viewer' && p.presence && p.presence.role === 'player' && p.presence.nick)
            .slice(0, 4)
            .map((p) => ({ p: p.peer, nick: String(p.presence.nick).slice(0, 24), uid: p.by || (typeof p.presence.uid === 'string' ? p.presence.uid : null) }))
          if (!S.M.players.some((p) => p.p === me())) S.M.players.unshift({ p: me(), nick: S.nick.slice(0, 24), uid: S.myUid })
        }
        // guests without permission to send events answer through their presence
        for (const p of ch.joined.concat(ch.updated)) if (!p.sameTab && p.presence && p.presence.ans) hostTakeAnswer(p.peer, p.presence.ans)
        if (ch.joined.length) broadcast()
        render()
      })
      S.game.on('answer', (msg) => hostTakeAnswer(msg.peer, msg.data))
      advertise()
    }
    S.screen = 'room'
    render()
  }
  function hostTakeAnswer(peer, d) {
    d = d || {}
    if (!S.M || d.code !== S.code || d.i !== S.M.i || d.ph !== S.M.phase || !Array.isArray(d.c)) return
    const c = d.c.filter((x) => typeof x === 'string').slice(0, 6)
    if (E.answer(S.M, MAP, peer, c, d.ms, Date.now())) { E.tick(S.M, Date.now()); if (S.M.phase === 'reveal') logReveal(S.M); broadcast(); render() }
  }
  function advertise() {
    if (!S.lobby || !S.isHost) return
    const M = S.M
    S.lobby.presence({ host: M && M.phase !== 'end' ? { code: S.code, cert: M.cert, mode: M.mode, n: M.n, secs: M.secs, nick: S.nick.slice(0, 24), phase: M.phase === 'lobby' ? 'lobby' : 'playing' } : null }).catch(() => {})
  }
  let lastCast = 0
  function broadcast() {
    if (!S.isHost || !S.game || !S.M) return
    const M = S.M
    const ansPublic = {}
    for (const [p, a] of Object.entries(M.ans)) ansPublic[p] = (M.phase === 'reveal' || M.phase === 'end') ? a : { done: 1, st: a.st }
    let sc = M.sc
    if (M.phase === 'q' || M.phase === 'steal') {
      sc = {}
      for (const [p, v] of Object.entries(M.sc)) {
        const a = M.ans[p]
        sc[p] = a ? { ...v, pts: v.pts - a.pts, ok: v.ok - (a.ok && !a.st ? 1 : 0), n: v.n - (a.st ? 0 : 1), stl: (v.stl || 0) - (a.st && a.ok ? 1 : 0) } : v
      }
    }
    const payload = { ...M, sc, ans: ansPublic, rem: M.deadline ? M.deadline - Date.now() : 0 }
    delete payload.deadline
    let json = JSON.stringify(payload)
    if (json.length > 3900) { delete payload.series; json = JSON.stringify(payload) }
    lastCast = Date.now()
    S.game.emit('state', payload).catch(() => {})
  }
  function startMatch() {
    const M = S.M
    E.start(M, BANK, Date.now() & 0x7fffffff, Date.now(), S.used)
    S.used.push(...M.qids)
    S.log = []
    S.screen = 'play'
    advertise(); broadcast(); render()
  }
  function rematch() {
    const prev = S.M
    const players = prev.players
    S.M = E.newMatch({ code: S.code, cert: prev.cert, mode: prev.mode, secs: prev.secs, series: prev.series, round: prev.round })
    S.M.n = prev.n; S.M.host = me(); S.M.players = players
    startMatch()
  }
  async function saveResult(M) {
    if (S.saved[M.code + ':' + M.round] || M.players.length < 1) return
    S.saved[M.code + ':' + M.round] = true
    const st = E.standings(M)
    const top = st[0]
    const tie = st.length > 1 && st[1].pts === top.pts
    const key = (pl) => pl.uid || 'nick:' + pl.nick.toLowerCase()
    if (!tie && st.length > 1) M.series[key(top)] = (M.series[key(top)] || 0) + 1
    if (!S.db) return
    try {
      await S.db.collection('duels').add({
        at: Date.now(), cert: M.cert, mode: M.mode, secs: M.secs, n: M.qids.length, solo: M.players.length === 1,
        winner: tie || st.length < 2 ? null : key(top),
        players: st.map((p) => ({ key: key(p), uid: p.uid || null, nick: p.nick, pts: p.pts, ok: p.ok, n: p.n, ms: p.ms, stl: p.stl || 0 })),
      })
    } catch (e) { S.msg = 'No se pudo guardar el resultado (' + (e && e.code || 'error') + ').' }
  }
  // host loop: timeouts, steals, reveal → next, heartbeat
  setInterval(() => {
    if (!S.isHost || !S.M) return
    const M = S.M
    const now = Date.now()
    let changed = E.tick(M, now)
    if (M.phase === 'reveal') logReveal(M)
    if (M.phase === 'reveal' && now >= M.deadline) { E.nextQuestion(M, now); changed = true }
    if (changed) {
      if (M.phase === 'end') { saveResult(M).then(() => { broadcast(); render() }); advertise() }
      broadcast(); render()
    } else if (S.game && now - lastCast > 1500 && M.phase !== 'lobby') broadcast()
    else if (S.screen === 'play') renderTimer()
  }, 200)

  function hostNext() { if (S.isHost && S.M && S.M.phase === 'reveal') { S.M.deadline = 0 } }

  // ---------- guest side
  async function joinGame(c) {
    c = String(c || '').trim().toLowerCase()
    if (!/^[a-z0-9]{4}$/.test(c)) { S.msg = 'El código tiene 4 caracteres.'; render(); return }
    if (!S.nick.trim()) { S.msg = 'Escribe tu alias para unirte.'; render(); return }
    if (!S.lobby) return
    store.set('nick', S.nick)
    try { S.game = await S.lobby.join('duel-' + c) } catch (e) {
      S.msg = e && e.code === 'not_found' ? 'No hay ninguna sala abierta con el código "' + c + '". Comprueba que tu compañero la ha creado y tiene la página abierta.' : 'No se pudo entrar en la sala (' + (e && (e.message || e.code) || 'error') + ').'
      render(); return
    }
    S.code = c; S.isHost = false; S.M = null; S.hostPeer = null; S.used = []
    S.game.presence({ nick: S.nick.slice(0, 24), uid: S.myUid, role: 'player' })
    S.game.onPeers((ch) => {
      S.peersInGame = ch.peers
      if (S.hostPeer && ch.left.some((p) => p.peer === S.hostPeer)) S.msg = 'El anfitrión ha salido de la partida.'
      render()
    })
    S.game.on('state', (msg) => {
      if (msg.sameTab) return
      const d = msg.data
      if (!d || d.code !== c) return
      if (!S.hostPeer) S.hostPeer = msg.peer
      if (msg.peer !== S.hostPeer) return // only the host drives the game
      const prevPhase = S.M && S.M.phase
      const prevKey = S.local.key
      S.M = d
      const key = d.i + ':' + d.phase
      if ((d.phase === 'q' || d.phase === 'steal') && key !== prevKey) {
        S.local = { key, start: Date.now(), deadline: Date.now() + Math.max(0, d.rem), chosen: [], sent: null }
      }
      if (d.phase === 'reveal' && prevPhase !== 'reveal') logReveal(d)
      if (d.phase === 'q' && d.i === 0 && prevPhase !== 'q') S.log = []
      S.screen = d.phase === 'lobby' ? 'room' : 'play'
      render()
    })
    S.screen = 'room'
    render()
  }
  // resend an unacknowledged answer until the host's state shows it
  setInterval(() => {
    if (S.isHost || !S.game || !S.M || !S.local.sent) return
    const a = S.M.ans && S.M.ans[me()]
    const ph = S.M.phase
    if (a && (a.st === (ph === 'steal') || ph === 'reveal')) { S.local.sent = null; return }
    if (S.local.sent.i !== S.M.i || S.local.sent.ph !== ph) { S.local.sent = null; return }
    sendAnswer(S.local.sent)
  }, 900)

  function sendAnswer(payload) {
    if (!S.game) return
    S.game.emit('answer', payload).catch(() => { /* view-level guests can't send events; presence carries it */ })
    S.game.presence({ ans: payload }).catch(() => {})
  }

  function leave() {
    if (S.game) S.game.leave().catch(() => {})
    if (S.isHost && S.lobby) S.lobby.presence({ host: null }).catch(() => {})
    S.game = null; S.M = null; S.isHost = false; S.hostPeer = null; S.screen = 'home'; S.msg = ''
    render()
  }

  // ---------- answering (both roles)
  function myTurn() {
    const M = S.M
    if (!M || (M.phase !== 'q' && M.phase !== 'steal')) return false
    if (!E.eligible(M).includes(me())) return false
    const a = M.ans[me()]
    return !(a && a.st === (M.phase === 'steal')) && !S.local.sent
  }
  function choose(id) {
    if (!myTurn()) return
    const q = MAP[S.M.qids[S.M.i]]
    const need = q.k.length
    const ch = S.local.chosen
    if (need === 1) S.local.chosen = [id]
    else S.local.chosen = ch.includes(id) ? ch.filter((x) => x !== id) : ch.concat(id)
    if (S.local.chosen.length === need) submit()
    else render()
  }
  function submit() {
    const M = S.M
    const ms = Date.now() - S.local.start
    const payload = { code: S.code, i: M.i, ph: M.phase, c: S.local.chosen.slice(), ms }
    if (S.isHost) {
      E.answer(M, MAP, me(), payload.c, ms, Date.now())
      E.tick(M, Date.now())
      if (M.phase === 'reveal') logReveal(M)
      broadcast()
    } else {
      S.local.sent = payload
      sendAnswer(payload)
    }
    render()
  }
  function logReveal(M) {
    const a = M.ans[me()]
    if (S.log.some((x) => x.i === M.i)) return
    S.log.push({ i: M.i, qid: M.qids[M.i], ok: !!(a && a.ok), pts: a ? a.pts : 0, ms: a ? a.ms : null })
  }

  // keyboard: 1–6 answer, Enter/N next (host), never while typing
  document.addEventListener('keydown', (e) => {
    const t = e.target
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return
    if (e.metaKey || e.ctrlKey || e.altKey || !S.M) return
    if (/^[1-6]$/.test(e.key) && (S.M.phase === 'q' || S.M.phase === 'steal')) {
      const q = MAP[S.M.qids[S.M.i]]
      const id = E.optionOrder(q, S.M.code)[Number(e.key) - 1]
      if (id) choose(id)
    } else if ((e.key === 'Enter' || e.key === 'n' || e.key === 'N') && S.M.phase === 'reveal') hostNext()
  })

  // ---------- rendering
  const app = document.getElementById('app')
  function colorOf(M, peer) {
    const i = M.players.findIndex((p) => p.p === peer)
    return COLORS[(i < 0 ? 0 : i) % COLORS.length]
  }
  function nickOf(M, peer) {
    const p = M.players.find((x) => x.p === peer)
    return p ? p.nick : '¿?'
  }
  function seg(values, current, onPick, fmt) {
    return h('div', { class: 'seg', role: 'group' }, values.map((v) => h('button', { type: 'button', 'aria-pressed': String(v === current), onclick: () => onPick(v) }, fmt ? fmt(v) : String(v))))
  }

  function render() {
    app.replaceChildren(...(S.screen === 'home' ? viewHome() : S.screen === 'room' ? viewRoom() : viewPlay()))
  }

  function header(sub) {
    return h('div', { class: 'row between' },
      h('div', {}, h('p', { class: 'label' }, sub || 'Claude Certified · entrenamiento en directo'), h('h1', {}, 'Duelo de certificación')),
      S.roomAvailable === null ? null
        : h('span', { class: 'chip' }, h('span', { class: 'dot' + (S.connected ? ' on' : '') }), S.roomAvailable ? (S.connected ? 'En directo' : 'Conectando…') : 'Solo local'))
  }

  function viewHome() {
    const out = [header()]
    out.push(h('p', { class: 'muted' }, 'Rondas cortas contra tu compañero de estudio. Misma pregunta y mismo reloj para todos; puntúan el acierto y la rapidez. En el modo por turnos, si fallas, el rival puede robar.'))
    if (S.msg) out.push(h('p', { class: 'warn' }, S.msg))

    const nickIn = h('input', { type: 'text', id: 'nick', maxlength: '24', placeholder: 'p. ej. David', value: S.nick, autocomplete: 'nickname', oninput: (e) => { S.nick = e.target.value } })
    out.push(h('div', { class: 'panel' },
      h('div', { class: 'field' }, h('label', { for: 'nick', class: 'label' }, 'Tu alias'), nickIn),
    ))

    // create
    const certSel = h('select', { id: 'cert', onchange: (e) => { S.cert = e.target.value } },
      CERTS.map((c) => h('option', { value: c.id, selected: c.id === S.cert }, c.id + ' · ' + c.name + ' (' + BANK.filter((q) => q.c === c.id).length + ')')))
    out.push(h('div', { class: 'panel' },
      h('h2', {}, 'Crear partida'),
      h('div', { class: 'field' }, h('label', { for: 'cert', class: 'label' }, 'Certificación'), certSel),
      h('div', { class: 'field' }, h('span', { class: 'label' }, 'Modo'),
        seg(['sim', 'turn'], S.mode, (v) => { S.mode = v; render() }, (v) => v === 'sim' ? 'Simultáneo' : 'Por turnos + robo')),
      h('div', { class: 'row' },
        h('div', { class: 'field' }, h('span', { class: 'label' }, 'Preguntas'), seg([5, 10, 15, 20], S.n, (v) => { S.n = v; render() })),
        h('div', { class: 'field' }, h('span', { class: 'label' }, 'Segundos por pregunta'), seg([20, 30, 45, 60], S.secs, (v) => { S.secs = v; render() })),
      ),
      h('div', { class: 'row' },
        h('button', { class: 'btn primary', type: 'button', disabled: !S.roomAvailable || !S.connected || !S.myPeer, onclick: () => createGame(false) }, 'Crear sala en directo'),
        h('button', { class: 'btn', type: 'button', onclick: () => createGame(true) }, 'Practicar solo'),
      ),
      S.roomAvailable === false ? h('p', { class: 'warn' }, liveWhy()) : null,
      window.__STANDALONE && !S.connected && S.roomAvailable ? h('p', { class: 'warn' }, 'No se pudo cargar la conexión en directo (¿sin internet o bloqueada por la red?). Puedes practicar solo.') : null,
      S.roomAvailable && S.canWrite === false && !S.canEdit ? h('p', { class: 'note' }, 'Con tu permiso actual ("Puede ver") puedes unirte a la sala de otro, pero no crear la tuya. Para crear salas, pide al propietario un permiso que permita interactuar o editar.') : null,
    ))

    // join
    if (S.roomAvailable) {
      const codeIn = h('input', { type: 'text', id: 'joincode', maxlength: '4', placeholder: 'abcd', autocomplete: 'off', style: 'max-width:9rem;font-family:var(--mono);letter-spacing:.1em' })
      out.push(h('div', { class: 'panel' },
        h('h2', {}, 'Unirse'),
        S.openGames.length
          ? h('div', { class: 'games' }, S.openGames.map((g) => h('div', { class: 'game' },
              h('div', {}, h('strong', {}, String(g.nick || 'Alguien')), h('span', { class: 'muted' }, ' · ' + g.cert + ' · ' + (g.mode === 'turn' ? 'por turnos' : 'simultáneo') + ' · ' + g.n + ' preg. · ' + g.secs + ' s')),
              h('button', { class: 'btn accent', type: 'button', onclick: () => joinGame(g.code) }, 'Entrar'))))
          : h('p', { class: 'note' }, window.__STANDALONE ? 'Pide a tu compañero el código de 4 letras de su sala y escríbelo aquí.' : 'No hay salas abiertas ahora mismo. Cuando tu compañero cree una, aparecerá aquí.'),
        h('div', { class: 'row' }, codeIn, h('button', { class: 'btn', type: 'button', onclick: () => joinGame(codeIn.value) }, 'Entrar con código')),
      ))
    }
    out.push(viewHistory())
    out.push(h('p', { class: 'note' }, 'Banco: ' + BANK.length + ' preguntas de práctica (originales de Claude Cert Trainer y bancos comunitarios con licencia MIT). No son preguntas reales del examen: esas son confidenciales.'))
    return out
  }

  function liveWhy() {
    const why = S.roomWhy
    if (why === 'not_granted' || why === 'revoked')
      return 'Tu cuenta no tiene acceso a la sala en directo de esta página (' + why + '). Pide al propietario que, en Compartir, te cambie "Puede ver" por un permiso que permita interactuar con la página (o editar), y recarga.'
    if (why === 'none')
      return 'Esta vista no puede conectarse en directo. Comprueba que la has abierto desde la invitación de claude.ai con tu sesión iniciada (no por un enlace público) y que tu permiso permite interactuar con la página. Mientras, puedes practicar solo.'
    return 'No se ha podido conectar al modo en directo (' + why + '). Recarga la página; si sigue igual, revisa tu permiso en Compartir. Mientras, puedes practicar solo.'
  }

  function viewHistory() {
    const rows = S.history.filter((d) => !d.solo && Array.isArray(d.players))
    if (!S.db) return null
    const agg = {}
    for (const d of rows) for (const p of d.players) {
      const a = agg[p.key] || (agg[p.key] = { key: p.key, uid: p.uid, nick: p.nick, games: 0, wins: 0, ok: 0, n: 0, ms: 0 })
      a.games++; a.ok += p.ok || 0; a.n += p.n || 0; a.ms += p.ms || 0
      if (d.winner === p.key) a.wins++
      a.nick = a.nick || p.nick
    }
    const list = Object.values(agg).sort((a, b) => b.wins - a.wins || (b.ok / Math.max(1, b.n)) - (a.ok / Math.max(1, a.n)))
    const panel = h('div', { class: 'panel' }, h('h2', {}, 'Clasificación'))
    if (!list.length) { panel.append(h('p', { class: 'note' }, window.__STANDALONE ? 'Aún no hay duelos guardados en este dispositivo.' : 'Aún no hay duelos guardados. Cada partida terminada se guarda aquí para los dos.')); return panel }
    panel.append(h('div', { class: 'tablewrap' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Jugador', 'Partidas', 'Victorias', 'Acierto', 'Tiempo medio'].map((t) => h('th', {}, t)))),
      h('tbody', {}, list.map((a) => h('tr', {},
        h('td', {}, a.nick || 'Alguien'),
        h('td', { class: 'mono' }, String(a.games)),
        h('td', { class: 'mono' }, String(a.wins)),
        h('td', { class: 'mono' }, a.n ? Math.round((a.ok / a.n) * 100) + ' %' : '—'),
        h('td', { class: 'mono' }, a.n ? (a.ms / a.n / 1000).toFixed(1) + ' s' : '—'),
      ))))))
    const last = rows.slice(0, 6)
    panel.append(h('p', { class: 'label' }, 'Últimos duelos'))
    panel.append(h('div', { class: 'games' }, last.map((d) => h('div', { class: 'game' },
      h('span', {}, d.players.map((p) => p.nick + ' ' + p.pts).join('  ·  ')),
      h('span', { class: 'muted mono' }, d.cert + ' · ' + new Date(d.at).toLocaleDateString())))))
    return panel
  }

  function viewRoom() {
    const M = S.M
    const out = [header(S.isHost ? 'Tu sala' : 'Sala de ' + (M ? nickOf(M, S.hostPeer || M.host) : '…'))]
    if (S.msg) out.push(h('p', { class: 'warn' }, S.msg))
    if (!M) { out.push(h('div', { class: 'panel' }, h('p', {}, 'Esperando al anfitrión…'), h('button', { class: 'btn', type: 'button', onclick: leave }, 'Salir'))); return out }
    const solo = S.code === 'solo'
    const codeBlock = solo ? null : h('div', { class: 'panel' },
      h('p', { class: 'label' }, 'Código de la sala'),
      h('div', { class: 'row between' }, h('span', { class: 'code', id: 'roomcode' }, S.code),
        h('button', { class: 'btn', type: 'button', onclick: async (e) => {
          const b = e.currentTarget
          try { await navigator.clipboard.writeText(S.code); b.textContent = 'Copiado' } catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('roomcode')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selecciónalo y copia' }
        } }, 'Copiar')),
      h('p', { class: 'note' }, 'Tu compañero verá la sala en "Unirse" al abrir esta misma página, o puede escribir el código.'))
    out.push(codeBlock)
    out.push(h('div', { class: 'panel' },
      h('p', { class: 'label' }, M.cert + ' · ' + (M.mode === 'turn' ? 'por turnos con robo' : 'simultáneo') + ' · ' + M.n + ' preguntas · ' + M.secs + ' s'),
      h('div', { class: 'players' }, M.players.map((p, i) => h('div', { class: 'pl', style: '--c:' + COLORS[i % 4] }, p.nick, p.p === me() ? h('small', {}, 'tú') : null, p.p === (M.host) ? h('small', {}, 'anfitrión') : null))),
      S.isHost
        ? h('div', { class: 'row' },
            h('button', { class: 'btn accent', type: 'button', onclick: startMatch }, M.players.length < 2 && !solo ? 'Empezar igualmente' : 'Empezar'),
            h('button', { class: 'btn', type: 'button', onclick: leave }, 'Cerrar sala'))
        : h('div', { class: 'row' }, h('p', { class: 'muted' }, 'Esperando a que el anfitrión empiece…'), h('button', { class: 'btn', type: 'button', onclick: leave }, 'Salir')),
      !solo && M.players.length < 2 ? h('p', { class: 'note' }, 'Esperando a tu compañero. Se unirá en cuanto entre en la sala.') : null,
    ))
    out.push(h('div', { class: 'panel' },
      h('p', { class: 'label' }, 'Reglas'),
      h('p', {}, M.mode === 'turn'
        ? 'Cada pregunta es de un jugador por turnos. Acierto: 100 puntos + hasta 50 por rapidez. Si fallas o se acaba el tiempo, el rival tiene 10 s para robar por 50.'
        : 'Todos responden a la misma pregunta a la vez. Acierto: 100 puntos + hasta 50 por rapidez. Fallo: 0. En respuesta múltiple se envía al marcar el número pedido.'),
      h('p', { class: 'note' }, 'Atajos: 1–6 para responder · Enter para pasar (anfitrión).')))
    return out
  }

  function scoreboard(M) {
    const turnPeer = (M.phase === 'q' || M.phase === 'steal') && M.mode === 'turn' ? M.active : null
    return h('div', { class: 'board' }, M.players.map((p, i) => {
      const a = M.ans[p.p]
      const raw = M.sc[p.p] || { pts: 0, ok: 0, n: 0 }
      const live = (M.phase === 'q' || M.phase === 'steal') && a && typeof a.pts === 'number'
      // during a question, show the score as it was before it so nobody learns the result early
      const s = live ? { pts: raw.pts - a.pts, ok: raw.ok - (a.ok && !a.st ? 1 : 0), n: raw.n - (a.st ? 0 : 1) } : raw
      const answered = a && (M.phase === 'reveal' || a.st === (M.phase === 'steal'))
      return h('div', { class: 'score' + (turnPeer === p.p ? ' turn' : ''), style: '--c:' + COLORS[i % 4] },
        h('span', { class: 'who' }, p.nick + (p.p === me() ? ' (tú)' : '')),
        h('span', { class: 'n' }, String(s.pts)),
        h('span', { class: 'mono muted', style: 'font-size:12px' }, s.ok + '/' + s.n + ' aciertos'),
        (M.phase === 'q' || M.phase === 'steal') && answered ? h('span', { class: 'flag' }, 'respondió') : null)
    }))
  }

  let timerEl = null
  function ring(totalMs, leftMs) {
    const r = 27, c = 2 * Math.PI * r
    const frac = Math.max(0, Math.min(1, leftMs / totalMs))
    const el = h('div', { class: 'ring' + (leftMs < 5000 ? ' low' : ''), role: 'timer', 'aria-label': 'Tiempo restante' })
    el.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="' + r + '"></circle><circle class="fg" cx="32" cy="32" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - frac)) + '"></circle></svg>'
    el.append(h('span', { class: 't' }, String(Math.ceil(leftMs / 1000))))
    return el
  }
  function deadlineNow() {
    if (S.isHost) return S.M.deadline
    return S.local.deadline
  }
  function renderTimer() {
    if (!timerEl || !S.M || (S.M.phase !== 'q' && S.M.phase !== 'steal')) return
    const total = S.M.phase === 'steal' ? E.STEAL_MS : S.M.secs * 1000
    const left = Math.max(0, deadlineNow() - Date.now())
    timerEl.replaceWith(timerEl = ring(total, left))
  }
  setInterval(() => { if (!S.isHost) renderTimer() }, 250)

  function viewPlay() {
    const M = S.M
    if (!M) return viewRoom()
    if (M.phase === 'end') return viewEnd()
    const q = MAP[M.qids[M.i]]
    if (!q) return [h('p', { class: 'warn' }, 'Pregunta no encontrada.')]
    const order = E.optionOrder(q, M.code)
    const out = []
    if (S.msg) out.push(h('p', { class: 'warn' }, S.msg))
    out.push(scoreboard(M))
    const playing = M.phase === 'q' || M.phase === 'steal'
    const total = M.phase === 'steal' ? E.STEAL_MS : M.secs * 1000
    if (playing && S.isHost && !S.local.key) S.local = { key: '', start: Date.now(), chosen: [], sent: null }
    if (playing && S.isHost && S.local.key !== M.i + ':' + M.phase) S.local = { key: M.i + ':' + M.phase, start: Date.now(), deadline: M.deadline, chosen: [], sent: null }
    timerEl = playing ? ring(total, Math.max(0, deadlineNow() - Date.now())) : null
    out.push(h('div', { class: 'qhead' }, timerEl,
      h('div', { style: 'min-width:0' },
        h('p', { class: 'label' }, 'Pregunta ' + (M.i + 1) + ' de ' + M.qids.length + ' · ' + q.c),
        h('p', { style: 'font-weight:700' }, q.d))))
    if (M.mode === 'turn' && playing && M.players.length > 1) {
      const mine = M.active === me()
      out.push(h('div', { class: 'banner', style: '--c:' + colorOf(M, M.active) },
        M.phase === 'steal' ? (mine ? '¡Rebote! Puedes robar por 50 puntos' : '¡Rebote! ' + nickOf(M, M.active) + ' puede robar') : (mine ? 'Tu turno' : 'Turno de ' + nickOf(M, M.active))))
    }
    if (q.x) out.push(h('div', { class: 'ctx', lang: 'en' }, rich(q.x)))
    out.push(h('p', { class: 'stem', lang: 'en' }, rich(q.s)))
    if (q.k.length > 1) out.push(h('p', { style: 'color:var(--accent);font-weight:700' }, 'Elige ' + q.k.length + ' (se envía al marcar la ' + (q.k.length === 2 ? 'segunda' : 'última') + ')'))

    const reveal = M.phase === 'reveal'
    const canAnswer = myTurn()
    const opts = h('div', { class: 'opts', role: q.k.length > 1 ? 'group' : 'radiogroup' }, order.map((id, idx) => {
      const text = (q.o.find((o) => o[0] === id) || [])[1]
      const sel = S.local.chosen.includes(id) || (S.local.sent && S.local.sent.c.includes(id))
      let cls = 'opt' + (sel ? ' sel' : '')
      if (reveal) cls = 'opt' + (q.k.includes(id) ? ' right' : (M.players.some((p) => (M.ans[p.p] && M.ans[p.p].c || []).includes(id)) ? ' wrong' : ''))
      const picks = reveal ? M.players.filter((p) => M.ans[p.p] && (M.ans[p.p].c || []).includes(id)).map((p) => h('span', { class: 'pick', style: '--c:' + colorOf(M, p.p) }, p.nick.slice(0, 10) + (M.ans[p.p].st ? ' (robo)' : ''))) : []
      return h('button', { class: cls, type: 'button', role: q.k.length > 1 ? 'checkbox' : 'radio', 'aria-checked': String(!!sel), disabled: !canAnswer, onclick: () => choose(id), lang: 'en' },
        h('span', { class: 'k' }, LETTERS[idx]), h('span', { class: 'txt' }, rich(text)), picks.length ? h('span', { class: 'picks' }, picks) : null)
    }))
    out.push(opts)

    if (playing) {
      const mine = M.ans[me()]
      const sent = S.local.sent || (mine && mine.st === (M.phase === 'steal'))
      if (sent) out.push(h('p', { class: 'muted' }, 'Respuesta enviada. Esperando al resto…'))
      else if (!E.eligible(M).includes(me())) out.push(h('p', { class: 'muted' }, 'Mira y piensa qué responderías.'))
    }
    if (reveal) {
      const gains = h('div', { class: 'row' }, M.players.map((p) => {
        const a = M.ans[p.p]
        return h('span', { class: 'chip', style: 'border-color:' + colorOf(M, p.p) },
          h('strong', {}, p.nick), h('span', { class: 'gain ' + (a && a.ok ? 'ok' : 'bad') }, a ? (a.ok ? '+' + a.pts : '0') : 'sin respuesta'),
          a && a.ms != null && !a.st ? h('span', { class: 'mono muted', style: 'font-size:12px' }, (a.ms / 1000).toFixed(1) + ' s') : null)
      }))
      out.push(gains)
      out.push(h('div', { class: 'panel' },
        h('p', { class: 'label' }, q.es ? 'Por qué' : 'Explicación de la fuente (inglés, sin traducir)'),
        h('p', { class: 'expl', lang: q.es ? 'es' : 'en' }, rich(remap(q.e, order)))))
      out.push(h('div', { class: 'sticky row between' },
        h('span', { class: 'note' }, 'Siguiente pregunta en unos segundos'),
        S.isHost ? h('button', { class: 'btn primary', type: 'button', onclick: hostNext }, 'Siguiente ya') : null))
    }
    return out
  }

  function viewEnd() {
    const M = S.M
    const st = E.standings(M)
    const out = [header('Fin de la ronda ' + (M.round || 1))]
    if (S.msg) out.push(h('p', { class: 'warn' }, S.msg))
    const top = st[0]
    const tie = st.length > 1 && st[1].pts === top.pts
    out.push(h('h2', { class: 'flash' }, st.length < 2 ? 'Ronda terminada' : tie ? 'Empate' : 'Gana ' + top.nick))
    out.push(h('div', { class: 'podium' }, st.map((p, i) => h('div', { class: 'place', style: '--c:' + colorOf(M, p.p) },
      h('span', { class: 'pos' }, String(i + 1)),
      h('div', { style: 'min-width:0' }, h('strong', {}, p.nick + (p.p === me() ? ' (tú)' : '')),
        h('p', { class: 'stats' }, (p.n ? Math.round((p.ok / p.n) * 100) : 0) + ' % acierto · ' + (p.n ? (p.ms / p.n / 1000).toFixed(1) : '—') + ' s de media' + (p.stl ? ' · ' + p.stl + ' robos' : ''))),
      h('span', { class: 'pts' }, String(p.pts))))))
    const series = M.series || {}
    const sk = Object.keys(series)
    if (sk.length) out.push(h('p', { class: 'muted' }, 'Serie: ' + M.players.map((p) => p.nick + ' ' + (series[p.uid || 'nick:' + p.nick.toLowerCase()] || 0)).join(' – ')))
    // personal review
    const missed = S.log.filter((x) => !x.ok)
    if (S.log.length) {
      out.push(h('div', { class: 'panel' },
        h('p', { class: 'label' }, 'Tus fallos de esta ronda (' + missed.length + ')'),
        missed.length ? h('div', { class: 'games' }, missed.map((x) => {
          const q = MAP[x.qid]
          const right = q.k.map((k) => (q.o.find((o) => o[0] === k) || [])[1]).join(' · ')
          return h('div', { class: 'game', style: 'flex-direction:column;align-items:flex-start' },
            h('span', { class: 'label' }, q.d), h('span', { lang: 'en' }, rich(q.s.length > 220 ? q.s.slice(0, 220) + '…' : q.s)), h('span', { style: 'color:var(--ok)', lang: 'en' }, '✓ ', rich(right)))
        })) : h('p', {}, 'Ninguno. Ronda perfecta.')))
    }
    out.push(h('div', { class: 'row' },
      S.isHost ? h('button', { class: 'btn accent', type: 'button', onclick: rematch }, 'Revancha (preguntas nuevas)') : h('p', { class: 'muted' }, 'El anfitrión puede lanzar la revancha.'),
      h('button', { class: 'btn', type: 'button', onclick: leave }, 'Salir')))
    out.push(viewHistory())
    return out
  }

  boot()
})()
</script>

</body>
</html>
