<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cert Arena</title>
<meta name="description" content="Entrena cualquier certificación jugando con amigos: salas por QR, puntuación por acierto, rapidez y racha. Gratis y sin cuentas.">
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23127a6b'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' text-anchor='middle' fill='white'%3ECA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: single centred column (max 48rem) that swaps screens; colour is reserved for players,
   right/wrong and one teal accent. Display face for headings and scores, hyperlegible body. */
:root {
  --bg: #f2efe8; --panel: #fffdf8; --ink: #1b1d22; --mute: #686672; --line: #dcd7cc;
  --accent: #127a6b; --accent-ink: #ffffff; --ok: #1d8a52; --bad: #c63b3b; --warn: #a8630f;
  --p1: #2f5bd8; --p2: #d0327f; --p3: #13867a; --p4: #b06a00; --p5: #7a46d1; --p6: #c44425; --p7: #3b7d22; --p8: #546070;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1e2026; --ink: #eeece6; --mute: #a19fa9; --line: #34363e;
    --accent: #3cc2ad; --accent-ink: #0d1a18; --ok: #4fca8a; --bad: #f07777; --warn: #e3a14a;
    --p1: #7f9cff; --p2: #f27cb8; --p3: #4fd2c3; --p4: #e8b04f; --p5: #b48cff; --p6: #ff8a6b; --p7: #8fd16b; --p8: #9aa6b6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1e2026; --ink: #eeece6; --mute: #a19fa9; --line: #34363e;
  --accent: #3cc2ad; --accent-ink: #0d1a18; --ok: #4fca8a; --bad: #f07777; --warn: #e3a14a;
  --p1: #7f9cff; --p2: #f27cb8; --p3: #4fd2c3; --p4: #e8b04f; --p5: #b48cff; --p6: #ff8a6b; --p7: #8fd16b; --p8: #9aa6b6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#app { max-width: 48rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 48px; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 7vw, 3.1rem); font-weight: 800; line-height: 1.02; }
.h1s { font-size: clamp(1.7rem, 5vw, 2.3rem); }
h2 { font-size: 1.3rem; font-weight: 800; }
p { margin: 0; }
.lead { font-size: 1.08rem; max-width: 36rem; }
.label { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--mute); } .small { font-size: 13px; }
.okc { color: var(--ok); } .badc { color: var(--bad); }
.grow { flex: 1; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; padding-block: 4px; }
.brand { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; font: 800 1.05rem var(--display); color: var(--ink); cursor: pointer; }
.mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 700 11px var(--mono); }
.top .label { margin-left: auto; }
.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 8px 4px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.accentpanel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); transition: border-color .15s, transform .1s; }
.btn:hover { border-color: var(--mute); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { min-height: 52px; padding: 0 24px; font-size: 1.05rem; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 6px 11px; min-height: 36px; color: var(--mute); font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input[type=text], input[type=url], select, textarea { border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; min-width: 0; width: 100%; }
input[type=text], input[type=url], select { height: 46px; padding-block: 0; }
textarea { font: 13px/1.45 var(--mono); resize: vertical; }
.codein { max-width: 8.5rem; font-family: var(--mono); letter-spacing: .14em; text-transform: uppercase; font-size: 1.1rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
.warn { font-size: 14.5px; border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 9%, var(--panel)); border-radius: 12px; padding: 10px 12px; }
.okmsg { border: 1px solid color-mix(in srgb, var(--ok) 50%, transparent); background: color-mix(in srgb, var(--ok) 9%, var(--panel)); border-radius: 12px; padding: 10px 12px; color: var(--ink); }
.note { font-size: 13.5px; color: var(--mute); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
.item.col { flex-direction: column; align-items: flex-start; gap: 4px; }
.doms summary { cursor: pointer; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--mute); }
.tag.on { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.invite { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 18px; }
.qr { width: 188px; max-width: 100%; aspect-ratio: 1; background: #fff; border-radius: 12px; padding: 6px; flex: none; display: grid; place-items: center; }
.qr svg { width: 100%; height: 100%; }
.invitext { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 8px; }
.code { font: 700 clamp(2.4rem, 11vw, 3.6rem)/1 var(--mono); letter-spacing: .12em; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.pl { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 8px 12px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 9%, var(--panel)); font-weight: 700; }
.pl small { font: 500 11px var(--mono); color: var(--mute); }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.score { border-radius: 14px; padding: 9px 12px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 9%, var(--panel)); display: flex; flex-direction: column; gap: 1px; position: relative; min-width: 0; }
.score .n { font: 800 1.65rem/1.05 var(--display); font-variant-numeric: tabular-nums; }
.score .who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 14px; }
.score.turn { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
.score.off { opacity: .55; }
.score .flag { position: absolute; top: 7px; right: 10px; color: var(--ok); font-weight: 700; }
.qhead { display: flex; align-items: center; gap: 14px; }
.dom { font-weight: 700; }
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.25rem; font-weight: 700; }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring.low .fg { stroke: var(--bad); }
.banner { font: 700 1rem var(--display); padding: 9px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.ctx { border-left: 3px solid var(--accent); padding: 6px 12px; color: var(--mute); font-size: 14.5px; background: color-mix(in srgb, var(--line) 30%, transparent); border-radius: 0 8px 8px 0; white-space: pre-wrap; }
.stem { font-size: 1.12rem; line-height: 1.5; white-space: pre-wrap; }
.need { color: var(--accent); font-weight: 700; }
code { font-family: var(--mono); font-size: .9em; background: color-mix(in srgb, var(--line) 50%, transparent); padding: 0 .25em; border-radius: 4px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 14px; font-size: 15.5px; line-height: 1.45; min-height: 54px; cursor: pointer; color: var(--ink); transition: border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--mute); }
.opt .k { font-size: 13px; font-weight: 700; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; flex: none; margin-top: 1px; }
.opt.sel { border-color: var(--ink); }
.opt.sel .k { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 11%, var(--panel)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
.opt:disabled { cursor: default; }
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.picks { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 40%; }
.pick { font: 700 11px var(--mono); color: #fff; background: var(--c); border-radius: 6px; padding: 2px 6px; }
.gain { font: 800 1.1rem var(--display); } .gain.ok { color: var(--ok); } .gain.bad { color: var(--bad); }
.expl { font-size: 14.5px; line-height: 1.55; }
.sticky { position: sticky; bottom: 0; padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 35%); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); }
.tablewrap { overflow-x: auto; }
.podium { display: flex; flex-direction: column; gap: 8px; }
.place { display: grid; grid-template-columns: 2.1rem 1fr auto; align-items: center; gap: 10px; border-radius: 14px; padding: 12px 14px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 8%, var(--panel)); }
.place .pos { font: 800 1.6rem var(--display); }
.place .stats { font-size: 12.5px; color: var(--mute); }
.place .pts { font: 800 1.7rem var(--display); font-variant-numeric: tabular-nums; }
.pop { animation: pop .45s ease-out; }
@keyframes pop { from { transform: scale(1.05); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } .ring .fg { transition: none; } }
</style>
